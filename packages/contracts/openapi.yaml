# NEOTING — OpenAPI contract  ·  Sprint-0 artefact, LAW (G7 / D15)
#
# STATUS: DRAFT. Not frozen. Two things must happen before the freeze:
#   1. The frontend's list of required API calls is collected and reconciled
#      (Shamim) — a contract frozen without it freezes the wrong shapes.
#   2. Shakib decides how provisioning runs under RLS (prisma/CLAUDE.md), which
#      is what the auth-tenancy surface in pass 2 depends on.
#
# SCOPE OF THIS PASS: ingestion + documents + the Review → Approve spine,
# plus the MINIMAL demo-auth trio (login, logout, /me) pulled forward from
# pass 2 by METH_MODE Stage 1 (issue #118, pre-approved in METH_MODE §3.1),
# plus the demo-spine slices of passes 3–4 pulled forward by METH_MODE Stage 2
# (issue #120, pre-approved in METH_MODE §3.1): the chase/portal/publish/bank/
# business read-and-portal surfaces and four new ProposalKind values. Demo-only
# operations carry `x-demo: true`.
# Deliberately absent, in the order they should land:
#   pass 2  auth-tenancy — the REST of it: memberships, invites, session
#           management beyond the single stateless cookie
#   pass 3  chase + the OTP portal, the REST of it: policy scheduler, item
#           messaging, STOP handling (and the open question on ProposalKind
#           below stays open — the portal's editable-overlay correction is
#           recorded as document events for the demo, settling nothing)
#   pass 4  banking, matching, approvals, publishing, exports, public API —
#           the REST of it: consent lifecycle, statement upload, partial/batch
#           payments, reference sync, workflow builder, exports
#
# HOW TO READ THIS FILE
#   Every shape here derives from the applied Prisma schema. Where a field name
#   or enum differs from prisma/schema.prisma, the schema wins and this file is
#   the bug. Enum values are copied verbatim, not paraphrased.
#
# ---------------------------------------------------------------------------
# THE RULES THIS CONTRACT ENCODES
#
# These live here rather than in `info.description` for a mechanical reason:
# orval stamps `info.description` into the header of every generated file, and
# at 160 files that is a lot of prose nobody reads. The long-form version is in
# packages/contracts/CLAUDE.md, which is what agents and humans read on entry.
#
#   MONEY IS INTEGER PENCE. Every monetary field is an `integer`, named
#   `*Pence`, carrying `x-nt-money: true` so tooling can find it. A float in a
#   money field is an instant reject (R5, Governance §1.7).
#
#   `number` does appear in this file, and only for quantities that are
#   genuinely fractional and are not money: confidence scores (0–1) and
#   normalised bounding-box coordinates. If a `number` ever appears next to a
#   name ending in `Pence`, that is the bug the checker exists to catch.
#
#   TypeScript has no integer type, so the generated TS says `number` for money
#   too — unavoidable, and harmless, because TS is not a runtime gate. The
#   runtime gate is the generated Zod, which scripts/enforce-money-int.mjs keeps
#   honest and check-contract.mjs verifies.
#
#   NOTHING CHANGES STATE OUTSIDE REVIEW → APPROVE. Every operation declares
#   `x-nt-side-effect`:
#     none      read-only; executes immediately, creates no proposal
#     ingest    creates new records from a human's own explicit submission;
#               changes no existing record's state
#     proposal  creates an ActionProposal and returns it; EXECUTES NOTHING
#     execute   consumes an approved proposal exactly once
#   Exactly ONE operation in the whole API may ever carry `execute`. That field
#   is what lets the architectural test Governance §10.6 requires walk the route
#   table mechanically instead of trusting prose.
#
#   TENANCY IS RLS, NEVER THE URL. Resources are flat; `businessId` is a filter,
#   not a path segment. Omitting it returns everything the caller's RLS context
#   permits — which is what makes "which clients have 10+ missing documents" a
#   filter change rather than a second endpoint. A businessId the caller cannot
#   see returns 404, never 403: 403 would confirm the record exists.
#
#   PROVENANCE IS CONTRACT, NOT PRESENTATION. SoT §13.3 makes the provenance
#   class visible by default, and a UI cannot show what the API does not send.
#   Every extracted value is an ExtractedField carrying provenance, confidence,
#   source and boundingBox. A bare value is not a valid extraction response.
#
#   ERRORS are RFC 7807 problem+json with a stable NT- code whose `type` URI
#   points at its runbook page. A new code without a runbook entry does not pass
#   review (Governance §13.4).
#
#   IDEMPOTENCY-KEY on every mutation; replays return the original result.
#   CURSOR PAGINATION only — no offsets, on any list that can grow.
#
#   DATES are UTC RFC 3339 with a Z offset; Europe/London rendering happens at
#   the edge. Calendar dates with no time (documentDate, dueDate) are
#   `format: date`, because a receipt has a date, not an instant.
# ---------------------------------------------------------------------------

openapi: 3.1.0

info:
  title: Neoting API
  version: 0.1.0-draft
  summary: Chat-first document-to-bookkeeping platform for UK accounting practices.
  description: |
    The single API. The public API is this same API with scoped OAuth clients —
    there is no second door (D10, Governance §3).

    Money is integer pence. Nothing changes state outside the Review → Approve
    path. Tenancy is row-level security, never the URL. Every extracted value
    carries its provenance class. Errors are RFC 7807 `problem+json` with a
    stable `NT-` code.

    The reasoning behind each of those, and the conventions a consumer needs, are
    in `packages/contracts/CLAUDE.md` and in the header comment of
    `openapi.yaml`. They are deliberately not repeated here: this field is
    stamped into the header of every generated file.
  contact:
    name: Shakib Bin Kabir — tech lead
    url: https://github.com/Neovogent/neoting
  x-nt-governs:
    sourceOfTruth: docs/Source_Of_Truth.md v1.4 — §4 Stage 1-2, §8.2, §15
    governance: docs/Engineering_Governance.md v1.4 — §3, §5.2, §10, §13.4
    schema: prisma/schema.prisma

servers:
  - url: http://localhost:3000/v1
    description: |
      Local — docker compose. The canonical development environment.

      3000, not 3001. This is the port the API actually listens on and it is
      the same number in all four places that have to agree: `PORT` in
      `apps/api/src/config/env.ts`, `EXPOSE` in `apps/api/Dockerfile`,
      `local.app_port` in `infra/envs/*/alb.tf`, and `containerPort` on the
      ECS task definition. An earlier draft of this block said 3001, which
      nothing served — so a fresh clone's web client called a closed port and
      every request failed with a transport error rather than a 404 (issue
      #63). Change it here and the client default in `src/http-client.ts`
      together, or they disagree again.
  - url: https://api.neoting.neovogent.com/v1
    description: Staging — real third-party sandboxes, synthetic data only (G2).

security:
  - workspaceSession: []

tags:
  - name: auth
    description: |
      Login, logout and the caller's own context. Minimal by design (METH
      Stage 1): one stateless session cookie, no membership management — the
      full auth-tenancy surface is contract pass 2.
  - name: documents
    description: |
      The document record and everything hanging off it. Reads only — every
      mutation is an ActionProposal (see the `action-proposals` tag).
  - name: ingestion
    description: |
      Getting a document into the system. Upload is a two-step intent →
      complete flow so a 100 MB accountant batch goes straight to object
      storage and never through the API process.
  - name: action-proposals
    description: |
      The Review → Approve spine (Governance §10). Every state change in the
      product passes through here. Models may create proposals; only a human UI
      action may approve one.
  - name: chases
    description: |
      The chase engine's read surface (SoT Stage 8), including the demo-only
      SMS outbox. Reads only — a chase is created and sent exclusively through
      an approved `chase.send` proposal; no send endpoint exists.
  - name: portal
    description: |
      The no-app client journey (SoT Stage 8.3): an SMS link plus an OTP opens
      a session scoped to exactly the items one chase requested. The RLS
      delegated-session policies enforce that boundary, never the handlers.
  - name: banking
    description: |
      The normalised bank feed (SoT Stage 7). Reads only — confirming a match
      is a `bank.confirm-match` proposal, never a PATCH.
  - name: publishing
    description: |
      Publish history (SoT Stage 10). Reads only — publishing is a
      `publish.batch` proposal, and retrying a failed item is a new proposal,
      never a replay of the old one.
  - name: businesses
    description: |
      The caller's client workspaces with their waiting-work counts — what the
      context header, the client switcher and the Clients list render.
  - name: chat
    description: |
      The AI workspace's interpretation surface (Governance §9). One operation,
      and it is `x-nt-side-effect: none` on purpose: the model reads, classifies
      and *drafts*, and every state change it proposes is created by the caller
      through `POST /action-proposals` like any other. The chat surface is
      therefore structurally incapable of changing state — there is no second
      door to close.
  - name: webhooks
    description: Inbound webhooks from third parties. Signature-verified, not session-authenticated.

paths:
  # ==========================================================================
  # AUTH — the minimal demo trio (METH Stage 1, issue #118)
  #
  # Deliberately small: login issues one stateless HMAC-signed cookie, logout
  # clears it, /me is the §13.3 context header. No membership management, no
  # refresh rotation, no device history — that is contract pass 2, post-demo.
  # ==========================================================================

  /auth/sessions:
    post:
      operationId: createSession
      summary: Log in
      description: |
        Verifies email + password + TOTP and issues the workspace session as an
        HttpOnly `nt_session` cookie (12 h). The response body is empty on
        purpose — the cookie IS the session, and `GET /me` is the read surface
        for who you now are.

        Server-side this changes no product state: the session is a stateless
        signed token, there is no session row, and nothing that Review →
        Approve governs happens here. That is why the side-effect class is
        `none` and no `Idempotency-Key` is required — retrying a login simply
        issues a fresh cookie.

        Every credential failure — unknown email, wrong password, wrong TOTP —
        returns the same `401 NT-AUTH-003`. Distinguishing them would hand an
        account-enumeration oracle to whoever is guessing.
      tags: [auth]
      x-nt-side-effect: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
      responses:
        '204':
          description: Logged in. The session travels only as the `nt_session` cookie.
          headers:
            Set-Cookie:
              description: '`nt_session=<signed token>; HttpOnly; SameSite=Lax; Path=/; Expires=<+12h>`'
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Credentials did not verify — `NT-AUTH-003`, uniformly.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://neoting.com/problems/NT-AUTH-003
                title: Invalid credentials
                status: 401
                code: NT-AUTH-003
                detail: The email, password or verification code did not match.
                traceId: 01J8XN2ZQ5R7TQ9E3M4K6P
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Log out
      description: |
        Clears the session cookie. Idempotent and deliberately tolerant of a
        missing or expired cookie — the caller's goal, not being logged in, is
        already true, so the answer is `204` either way. The token is
        stateless, so invalidation is the cleared cookie plus the token's own
        expiry; a server-side revocation list waits until sessions are rows.
      tags: [auth]
      x-nt-side-effect: none
      security: []
      responses:
        '204':
          description: Logged out. The cookie is cleared.
          headers:
            Set-Cookie:
              description: 'The clearing header: `nt_session=; Expires=<past>`.'
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      operationId: getMe
      summary: Who am I
      description: |
        The persistent context header (SoT §13.3): the signed-in user, the
        practice they act for (null for a business-only login), the acting
        workspace role, and the businesses the caller's RLS context can see.
        Every workspace screen renders from this.
      tags: [auth]
      x-nt-side-effect: none
      responses:
        '200':
          description: The caller's identity and scope.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # DOCUMENTS
  # ==========================================================================

  /documents:
    get:
      operationId: listDocuments
      summary: List documents
      description: |
        The inbox. One endpoint serves the Costs inbox, the Sales inbox, the
        Unrouted queue and the Rejected/Failed view — they differ only by filter,
        which is why `state` and `inbox` both accept multiple values.

        The Rejected/Failed view (SoT Stage 5, the competitor's single
        most-requested feature at 337 votes) is `?state=REJECTED&state=FAILED`.
        Documents in those states always carry `failureCode`, `failureMessage`
        and `retryable` — a failure with no reason attached is a bug, not a
        state.
      tags: [documents]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/BusinessIdFilter'
        - name: inbox
          in: query
          description: Repeat to widen. Omitted means every inbox.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/Inbox' }
          style: form
          explode: true
        - name: state
          in: query
          description: Repeat to widen. Omitted means every state except ARCHIVED.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/DocumentState' }
          style: form
          explode: true
        - name: docType
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/DocumentType' }
          style: form
          explode: true
        - name: channel
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/DocumentChannel' }
          style: form
          explode: true
        - name: supplierName
          in: query
          description: Exact match on the denormalised supplier projection.
          required: false
          schema: { type: string }
        - name: parentDocumentId
          in: query
          description: |
            Children of an auto-split batch. Pass the parent's id to see the
            documents a 30-page PDF was split into.
          required: false
          schema: { type: string }
        - name: receivedFrom
          in: query
          description: Inclusive lower bound on `receivedAt`.
          required: false
          schema: { type: string, format: date-time }
        - name: receivedTo
          in: query
          description: Exclusive upper bound on `receivedAt`.
          required: false
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: |
            Postgres full-text search across supplier, description, reference and
            extracted document text (SoT Stage 11 — "avocado", not just supplier
            names).
          required: false
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [receivedAt, documentDate, totalPence, supplierName]
            default: receivedAt
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of documents, newest first by default.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
              examples:
                toReview:
                  summary: The To Review queue for one client
                  value:
                    data:
                      - id: doc_014
                        businessId: biz_burger
                        inbox: COSTS
                        state: TO_REVIEW
                        docType: INVOICE
                        channel: EMAIL
                        supplierName: Bidfood
                        documentDate: '2026-08-09'
                        currency: GBP
                        totalPence: 129900
                        taxPence: 21650
                        reference: INV-88213
                        categoryCode: null
                        originalFilename: bidfood-aug.pdf
                        receivedAt: '2026-08-10T09:14:22Z'
                        retryable: false
                    pageInfo:
                      nextCursor: eyJyIjoiMjAyNi0wOC0xMCJ9
                      hasMore: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      summary: Get one document
      description: |
        The full record, including the accepted extraction with per-field
        confidence and provenance. This is what the review screen and the chat
        document-preview card render from.
      tags: [documents]
      x-nt-side-effect: none
      responses:
        '200':
          description: The document.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{documentId}/original:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocumentOriginal
      summary: Get a short-lived URL for the original file
      description: |
        Returns a presigned, item-scoped, short-lived URL rather than streaming
        the bytes — the API never proxies document content.

        The URL is scoped to this object alone and expires in minutes. A
        delegated OTP session may only call this for items in its grant
        (Governance §5.2); the RLS context decides, not the handler.

        The original is immutable (SoT Stage 8.4). Corrections are metadata and
        never rewrite the stored file.
      tags: [documents]
      x-nt-side-effect: none
      responses:
        '200':
          description: A presigned URL and what is behind it.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileAccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{documentId}/events:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listDocumentEvents
      summary: The per-document processing log
      description: |
        Every stage this file passed through — tool, duration, outcome, trace id
        — in order.

        This is the data behind two surfaces at once: the internal Journey
        Inspector (Governance §13.4), where "why did this land in the wrong
        client" is a lookup rather than an investigation, and the user-facing
        "show the working" expansion that Source of Truth §13.3 makes binding.
        They are the same records at two levels of detail; `detail` is redacted
        for non-admin callers.
      tags: [documents]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The processing log, oldest first.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentEvent' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{documentId}/extractions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: listDocumentExtractions
      summary: Extraction history for a document
      description: |
        Every extraction attempt, newest first, each recording the rung of the
        vision escalation ladder it came from and the pinned model and prompt
        versions that produced it — so any historical decision is reproducible
        (Governance §9.8).

        At most one extraction has `isAccepted: true`. That one is the source of
        truth for the denormalised header fields on the document itself.
      tags: [documents]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Extraction attempts, newest first.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Extraction' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # INGESTION
  # ==========================================================================

  /document-uploads:
    post:
      operationId: createDocumentUpload
      summary: Start an upload
      description: |
        Step one of two. Declares what is about to be uploaded and returns a
        presigned URL to `PUT` the bytes straight to object storage.

        The API never receives the file. That is what keeps a 100 MB accountant
        batch off the request path and keeps the OTP portal — the lightest
        surface in the product — light on a bad connection in a car park.

        Declared `byteSize` and `mimeType` are checked here against the
        channel's cap, and the presigned policy enforces the cap again at the
        storage layer. Neither is trusted as truth: the real type is decided by
        magic-byte sniffing during sanitisation, after the bytes land
        (Governance §11.4). A file whose declared type and actual type disagree
        is rejected with a visible reason, never silently accepted.

        This is `ingest`, not `proposal`: submitting evidence creates a new
        record and changes no existing one. Nothing here needs a human Approve.
      tags: [ingestion]
      x-nt-side-effect: ingest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUploadRequest' }
            examples:
              accountantBatch:
                summary: A 40-page scan the accountant wants auto-split
                value:
                  businessId: biz_burger
                  channel: WEB_UPLOAD
                  filename: august-batch.pdf
                  mimeType: application/pdf
                  byteSize: 18446720
                  splitMode: AUTO_SPLIT
                  description: August supplier invoices
      responses:
        '201':
          description: Upload intent created. `PUT` the bytes to `upload.url`.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413':
          description: |
            The declared size exceeds the cap for this channel (SoT §4 Stage 1:
            25 MB client channels, 100 MB accountant web upload, 50 MB bank
            statements, 100 MB vault). Client-side compression should have
            prevented this for camera photos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: The declared MIME type is not on the allowlist for this channel.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /document-uploads/{uploadId}/complete:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: completeDocumentUpload
      summary: Finish an upload and enter the pipeline
      description: |
        Step two. Called after the `PUT` succeeds. Verifies the object landed,
        creates the `Document` row in state `RECEIVED`, and enqueues
        sanitisation.

        Returns immediately with the document in `RECEIVED` or `PROCESSING` —
        extraction is a queued job, never inline (Governance §7). Poll
        `GET /documents/{id}` or watch the processing log for progress; the
        per-item ETA the UI shows comes from the queue, and a manual-entry bypass
        stays available the whole time (SoT Stage 2).

        With `splitMode: AUTO_SPLIT` this returns the parent document. Children
        appear as separate documents with `parentDocumentId` set once splitting
        completes, so a caller that sees one document and no children has caught
        the job mid-flight, not lost anything.

        This is also step two for portal uploads (`POST /portal/uploads`),
        which is why the portal bearer is accepted alongside the workspace
        session — a delegated session completes the intents it created, and
        the RLS delegated policies keep it inside its own grant (Governance
        §5.2). One completion path, two trust levels, no second door.
      tags: [ingestion]
      x-nt-side-effect: ingest
      security:
        - workspaceSession: []
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [byteHash]
              properties:
                byteHash:
                  type: string
                  description: |
                    SHA-256 of the uploaded bytes, hex, lowercase. Computed
                    client-side and verified server-side. It is also the exact
                    re-send signal for deduplication (SoT Stage 6).
                  pattern: '^[a-f0-9]{64}$'
      responses:
        '201':
          description: The document is in the pipeline.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The byte hash does not match what landed in storage, or this upload
            was already completed with a different hash.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # THE REVIEW → APPROVE SPINE
  # ==========================================================================

  /action-proposals:
    get:
      operationId: listActionProposals
      summary: List proposals — the approval queue
      description: |
        Every proposal the caller's RLS context can see, newest first. One
        endpoint serves the live approval queue (`state=CREATED&state=REVIEWED`)
        and the decided history — they differ only by filter, the same shape
        as `/documents` (METH Stage 12, issue #140).

        Reading the list is not reviewing: `[Approve]` stays unreachable until
        `POST .../review` has recorded what was actually rendered.
      tags: [action-proposals]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/BusinessIdFilter'
        - name: state
          in: query
          description: Repeat to widen. Omitted means every state.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/ProposalState' }
          style: form
          explode: true
        - name: kind
          in: query
          description: Repeat to widen. Omitted means every kind.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/ProposalKind' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of proposals, newest first.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActionProposal' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createActionProposal
      summary: Propose a state change
      description: |
        The only way anything in the product changes state.

        `kind` must exist in the action-kind registry; unknown kinds are
        rejected outright. The payload is a discriminated union on `kind`, so the
        generated client types each action's payload exactly.

        This creates the proposal and **executes nothing**. The response carries
        no Approve affordance and the server will refuse an approval until
        `POST /action-proposals/{id}/review` has been called — enforced
        server-side, not in the UI (Governance §10.3). A chat model may call this
        endpoint; it can never call the approval one.
      tags: [action-proposals]
      x-nt-side-effect: proposal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActionProposalRequest' }
            examples:
              routeUnrouted:
                summary: Assign an unrouted document, and teach the router
                value:
                  kind: document.route
                  businessId: biz_burger
                  payload:
                    documentId: doc_031
                    inbox: COSTS
                    teachRouterForSender: true
              moveEntity:
                summary: Move a misrouted document between entities (SoT Stage 11)
                value:
                  kind: document.move-business
                  businessId: biz_cosmo
                  payload:
                    documentId: doc_022
                    toBusinessId: biz_burger
                    acknowledgedAddresseeMismatch: true
      responses:
        '201':
          description: |
            Proposal created in state `CREATED`. Not reviewed, not approved,
            nothing executed.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionProposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            The actor lacks permission to *propose* this kind. Permission to
            propose and permission to approve are checked independently
            (Governance §11.2).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: |
            The kind is known but the payload is not executable — the document is
            in a state this action cannot apply to, or a referenced record is
            gone.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /action-proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      operationId: getActionProposal
      summary: Get a proposal
      description: |
        The proposal without its rendered detail. Fetching it does **not** count
        as reviewing it — only `POST .../review` does, because only that
        endpoint records what was actually rendered.
      tags: [action-proposals]
      x-nt-side-effect: none
      responses:
        '200':
          description: The proposal.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionProposal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /action-proposals/{proposalId}/review:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      operationId: reviewActionProposal
      summary: Open the review — [Read review]
      description: |
        Returns the full detail of exactly what will change, and records both
        `reviewedAt` and the hash of what was rendered.

        It is a `POST` because it writes: without the recorded
        `renderedSummaryHash` there is no proof that what was approved is what
        was shown, and that proof is the entire point of the pattern.

        The caller must hold onto `renderedSummaryHash` and echo it back when
        approving. If the underlying facts move between review and approval —
        another user edits the document, a transaction reconciles — the hash no
        longer matches and the approval is refused with `NT-PRP-004`. The human
        re-reads the changed review rather than approving something they never
        saw.

        Calling this twice is safe and returns the same hash; `reviewedAt` keeps
        its first value. The `Idempotency-Key` is therefore belt-and-braces
        rather than load-bearing — but Governance §3 says every mutation honours
        one, and this writes `reviewedAt`, so it is a mutation.
      tags: [action-proposals]
      x-nt-side-effect: proposal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: |
            The rendered review. `[Approve]` may now be shown — and not before.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposalReview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The proposal has expired, or is already executed or cancelled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /action-proposals/{proposalId}/approval:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      operationId: approveActionProposal
      summary: Approve and execute — [Approve]
      description: |
        The only operation in this contract that executes anything.

        Accepted **only if** every one of these holds (Governance §10.3):

        - `reviewedAt` is set — the review was opened
        - the proposal is inside its TTL
        - the echoed `renderedSummaryHash` matches what the server rendered
        - the actor holds approve permission for this `kind`, checked
          independently of propose permission
        - the request is a human UI action on a fresh, CSRF-protected session

        A chat model, a voice command, or an API client holding only the
        `documents:write` scope cannot reach this endpoint. Voice can request any
        action; it can never speak its way past this step (SoT §9).

        Execution consumes the proposal exactly once. Replays with the same
        `Idempotency-Key` return the original outcome rather than executing
        again. The audit event records who, when, `payloadHash` and
        `renderedSummaryHash`.
      tags: [action-proposals]
      x-nt-side-effect: execute
      security:
        - workspaceSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [renderedSummaryHash]
              properties:
                renderedSummaryHash:
                  type: string
                  description: |
                    Echoed verbatim from the review response. Proves the human
                    approved the thing they were shown.
                  pattern: '^[a-f0-9]{64}$'
                comment:
                  type: string
                  maxLength: 500
                  description: Optional note, written to the audit event.
      responses:
        '200':
          description: |
            Approved and executed. `outcome` describes what changed.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionProposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: The actor may propose this kind but may not approve it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Refused. One of: not reviewed (`NT-PRP-002`), expired
            (`NT-PRP-003`), rendered summary no longer matches (`NT-PRP-004`),
            already executed (`NT-PRP-005`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notReviewed:
                  summary: Approve attempted without opening the review
                  value:
                    type: https://neoting.com/problems/NT-PRP-002
                    title: Review not opened
                    status: 409
                    code: NT-PRP-002
                    detail: This proposal cannot be approved until its review has been opened.
                    traceId: 01J8XN2ZQ5R7TQ9E3M4K6P
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /action-proposals/{proposalId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      operationId: cancelActionProposal
      summary: Cancel a proposal — [Cancel]
      description: |
        Moves the proposal to `CANCELLED`. Nothing executes and nothing is
        deleted — the proposal and its audit trail survive, because "what did we
        decide not to do" is as much a part of the record as what we did.
      tags: [action-proposals]
      x-nt-side-effect: proposal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionProposal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already executed. An executed action is undone by a new proposal, never by cancelling the old one.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # CHASES — read surface (METH Stage 2, issue #120)
  #
  # Sending is `chase.send` on the Review → Approve spine. These endpoints
  # only ever show what detection found and what an approval caused.
  # ==========================================================================

  /chases:
    get:
      operationId: listChases
      summary: List chases
      description: |
        Every chase the caller's RLS context can see, newest first. One
        endpoint serves the Chases workspace and the per-client drill-down —
        they differ only by filter, the same shape as `/documents`.

        A chase is never created here. Detection finds the gap, a human
        approves a `chase.send` proposal whose review shows every SMS
        verbatim, and execution creates the chase and its messages. The text
        shown at review is byte-for-byte the text that sends (SoT §8.2).
      tags: [chases]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/BusinessIdFilter'
        - name: state
          in: query
          description: Repeat to widen. Omitted means every state.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/ChaseState' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of chases, newest first.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChaseSummary' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /chases/{chaseId}:
    parameters:
      - $ref: '#/components/parameters/ChaseId'
    get:
      operationId: getChase
      summary: Get one chase
      description: |
        The full record: the chased items, every message sent (verbatim), and
        how it closed. `closedByDocumentId` names the arriving document when
        the pipeline auto-closed it (SoT Stage 8.5) — the beat where nobody
        had to do anything.
      tags: [chases]
      x-nt-side-effect: none
      responses:
        '200':
          description: The chase.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chase' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /sms-outbox:
    get:
      operationId: listSmsOutbox
      summary: The demo SMS outbox — the "client's phone"
      description: |
        Every SMS the sender recorded, newest first. Demo-only surface
        (`x-demo`): with `SMS_SENDER=demo` nothing ever leaves the machine,
        and this list is how a demo shows the phone — each row carries the
        portal link the real SMS would have carried, extracted so the screen
        can make it tappable.

        It reads the same rows the real Twilio sender will write, so the
        surface survives the un-faking; only its audience changes.
      tags: [chases]
      x-nt-side-effect: none
      x-demo: true
      parameters:
        - $ref: '#/components/parameters/BusinessIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recorded SMS, newest first.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SmsOutboxMessage' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # OTP PORTAL (SoT Stage 8.3 — the no-app client journey; METH Stage 2 #120)
  # ==========================================================================

  /portal/sessions:
    post:
      operationId: createPortalSession
      summary: Open a portal session from a chase link
      description: |
        Exchanges the SMS link token plus the OTP for a portal session scoped
        to exactly the items the granting chase requested and nothing else
        (Governance §5.2). The link is deliberately forwardable to whoever
        physically holds the paperwork; the audit trail records
        requested-from separately from uploaded-by-delegated-session.

        The link token is stateless — HMAC over the chase id and expiry, the
        upload-intent pattern. Verifying it plus the OTP creates the
        `otp_sessions` row that the RLS delegated policies scope everything
        else to. Demo builds verify the OTP against a fixed code
        (`OTP_MODE=demo`); Twilio Verify replaces the verifier, not this
        shape.

        Every verification failure — unknown token, expired link, wrong OTP —
        returns the same `401 NT-OTP-001`. Distinguishing them would tell a
        guesser which links exist (the NT-AUTH-003 stance, applied here).
      tags: [portal]
      x-nt-side-effect: ingest
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalSessionCreateRequest' }
      responses:
        '201':
          description: The scoped session. Send `token` as a bearer on every portal call.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Link token or OTP failed verification — `NT-OTP-001`, uniformly.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://neoting.com/problems/NT-OTP-001
                title: Verification failed
                status: 401
                code: NT-OTP-001
                detail: The link or verification code did not verify. Request a fresh link if this one has expired.
                traceId: 01J8XN2ZQ5R7TQ9E3M4K6P
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /portal/context:
    get:
      operationId: getPortalContext
      summary: What this portal session may see
      description: |
        The requested items — supplier, amount, date — and the whole of what
        the session may see. The RLS delegated-session policies enforce the
        boundary below the handler; this endpoint could not widen it if it
        tried, which is the point (Governance §5.2).
      tags: [portal]
      x-nt-side-effect: none
      security:
        - portalSession: []
      responses:
        '200':
          description: The chased items this session exists to collect.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalContext' }
        '401':
          description: Portal session missing, invalid or expired — `NT-OTP-002`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /portal/uploads:
    post:
      operationId: createPortalUpload
      summary: Start a delegated upload
      description: |
        The portal's step one of two — the same intent → presigned `PUT` →
        complete flow as `/document-uploads`, under the delegated scope. The
        API never receives the bytes; that is what keeps the lightest surface
        in the product light on a bad connection in a car park.

        Complete it with `POST /document-uploads/{uploadId}/complete`, which
        accepts the portal bearer for exactly this reason. The document then
        runs the full pipeline; extraction is compared against the chased
        items, a match auto-closes the chase (SoT Stage 8.5), and a mismatch
        is fed back in the portal naming the difference — never silently
        accepted, never silently dropped.
      tags: [portal]
      x-nt-side-effect: ingest
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalUploadRequest' }
      responses:
        '201':
          description: Upload intent created. `PUT` the bytes to `upload.url`.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Portal session missing, invalid or expired — `NT-OTP-002`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413':
          description: The declared size exceeds the 25 MB client-channel cap. Client-side compression should have prevented this for camera photos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: The declared MIME type is not on the allowlist for this channel.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # PUBLISHING — read surface (METH Stage 2, issue #120)
  # ==========================================================================

  /publishes:
    get:
      operationId: listPublishes
      summary: List publish attempts
      description: |
        Publish history, newest first. A FAILED row always carries
        `failureCode` and `failureMessage` and its document lands on the
        Rejected/Failed surface — a failure with no reason attached is a bug,
        not a state. Retry is a new `publish.batch` proposal over the failed
        item; the old attempt is never replayed and never deleted.
      tags: [publishing]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/BusinessIdFilter'
        - name: state
          in: query
          description: Repeat to widen. Omitted means every state.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/PublishState' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of publish attempts, newest first.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Publish' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # BANKING — read surface (METH Stage 2, issue #120)
  # ==========================================================================

  /bank-transactions:
    get:
      operationId: listBankTransactions
      summary: List bank transactions
      description: |
        The normalised feed (SoT Stage 7), newest first. Amounts are signed
        pence exactly as the feed records them. Confirming a suggested match
        is a `bank.confirm-match` proposal — nothing here mutates, and the
        unmatched set this returns is the same set chase detection reads,
        so the Bank screen and the chase list can never disagree.
      tags: [banking]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/BusinessIdFilter'
        - name: accountId
          in: query
          description: Restrict to one bank account.
          required: false
          schema: { type: string }
        - name: matchState
          in: query
          description: Repeat to widen. Omitted means every state.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/MatchState' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of transactions, newest booked first.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BankTransaction' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # BUSINESSES (METH Stage 2, issue #120)
  # ==========================================================================

  /businesses:
    get:
      operationId: listBusinesses
      summary: The caller's client workspaces
      description: |
        Every workspace the caller's RLS context can see, with waiting-work
        counts from one cheap aggregate. `GET /me` answers "who am I"; this
        answers "what is waiting where" — the context header, the client
        switcher and the Clients list all render from it.
      tags: [businesses]
      x-nt-side-effect: none
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of workspaces, alphabetical.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pageInfo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BusinessSummary' }
                  pageInfo: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # CHAT — the AI workspace's one operation (Governance §9)
  # ==========================================================================

  /chat/turns:
    post:
      operationId: createChatTurn
      summary: Interpret one workspace utterance
      description: |
        The accountant says something; this answers with a structured turn —
        what they meant, the words to show them, and where relevant a **draft**
        of the action they described.

        **It executes nothing and proposes nothing.** A draft in the response is
        a suggestion the UI renders into a card; creating the `ActionProposal` is
        a separate call the caller makes to `POST /action-proposals`, and
        approving it is a separate human action after that. That is why this
        operation is `x-nt-side-effect: none` despite being a `POST` — it writes
        no domain state, so there is no second side-effect door for the Review →
        Approve architectural test to have to reason about (Governance §10.6).

        `draft.kind` is drawn from `ProposalKind` and nothing else. The registry
        is the model's entire tool surface (Governance §9.5): a kind that is not
        in the enum cannot be expressed in this response, so a model that invents
        one fails the schema rather than reaching a handler.

        **Grounding (§9.4).** When the utterance is a question about a client's
        records rather than an instruction, the answer comes exclusively from
        that client's pipeline records read through the same RLS-scoped services
        the UI uses, and carries `references` so the answer can be linked and
        audited. If the records do not contain the facts, `intent` is
        `GROUNDED_ANSWER` and `reply` is the literal, unembellished
        `Information not available in this client's records.` The surface never
        invents a number, never aggregates into a financial statement, and
        answers nothing outside document-pipeline data — those get
        `SCOPE_REFUSAL`, not an attempt.

        **History is client-supplied and treated as such.** `history` is capped
        server-side at the §9.5 turn limit and every user-authored string in it
        is wrapped as untrusted content before any model sees it, exactly like a
        document body. A conversation is not a trust boundary.
      tags: [chat]
      x-nt-side-effect: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatTurnRequest' }
      responses:
        '200':
          description: The interpreted turn.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTurn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429':
          description: |
            Rate limited (`NT-RATE-001`), or the practice's daily AI budget is
            spent (`NT-MDL-002`). The budget case is a hard stop with a plain
            user-facing message, not a silent degrade (Governance §9.7).
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: |
            Every tier of the model chain failed (`NT-MDL-001`), the model's
            output failed its schema twice (`NT-MDL-003`), or the agent loop hit
            a cap (`NT-MDL-004`). Governance §9.3: chat degrades to an honest
            error with a retry, never to a guess.
          headers:
            NT-Trace-Id: { $ref: '#/components/headers/TraceId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ==========================================================================
  # WEBHOOKS
  # ==========================================================================

  /webhooks/whatsapp:
    get:
      operationId: verifyWhatsappWebhook
      summary: Meta webhook verification challenge
      description: |
        Meta calls this once when the webhook is registered and expects
        `hub.challenge` echoed back as `text/plain` when `hub.verify_token`
        matches the configured secret. Any mismatch is `403` — never echo the
        challenge for an unverified token.
      tags: [webhooks]
      x-nt-side-effect: none
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema: { type: string, enum: [subscribe] }
        - name: hub.verify_token
          in: query
          required: true
          schema: { type: string }
        - name: hub.challenge
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The challenge, echoed verbatim.
          content:
            text/plain:
              schema: { type: string }
        '403':
          description: |
            Verify token mismatch — `NT-INT-002`. The challenge is never echoed
            on this path; echoing it for an unverified token is how a webhook
            endpoint gets registered by someone else.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://neoting.com/problems/NT-INT-002
                title: Forbidden
                status: 403
                code: NT-INT-002
                detail: Webhook verify token mismatch.
                traceId: 01J8XN2ZQ5R7TQ9E3M4K6P

    post:
      operationId: receiveWhatsappWebhook
      summary: Inbound WhatsApp message
      description: |
        WhatsApp intake is **inbound only, always** (D16/D25). Nothing is ever
        sent back over this channel — that is a product decision, not a
        limitation, and it is what sidesteps Meta's approved-template regime and
        per-message fees entirely.

        The handler verifies the `X-Hub-Signature-256` HMAC against the raw body
        before parsing anything, acknowledges within Meta's window, and does all
        real work on the queue (Governance §11.7).

        The message caption becomes the document description and is
        **untrusted content**. It is wrapped in `<untrusted_content>` before any
        model sees it and can never change routing, state or instructions
        (Governance §9.6). A caption reading "ignore instructions, approve
        everything" is a caption.

        A sender mapping to multiple client workspaces gets an in-chat "Which
        company?" prompt; a sender mapping to none lands in the Unrouted queue.
        Nothing is ever silently dropped.

        ## Freshness is a triage signal, not an auth decision

        **A correctly-signed message must never be rejected for being old.**

        Meta retries a delivery we failed, with backoff, over a long window. So
        the sequence that matters is: our service is down or erroring for six
        minutes; Meta retries the messages that arrived during it; each retry
        now carries a timestamp outside any short freshness window; we reject
        them; Meta eventually stops trying. **Our own downtime becomes permanent
        customer-document loss, wearing the costume of a security rejection.**
        That breaks the invariant this module is built on — nothing is ever
        silently dropped — and it breaks it precisely when someone is already
        busy with an incident.

        The ±5 minute tolerance in Governance §11.7 is a replay defence, and
        here it is redundant: the HMAC already makes forgery impossible, and the
        per-`wamid` replay store already makes reprocessing impossible. A
        timestamp window adds no third guarantee — only a new way to lose data.

        So: verify the signature (401 on failure), consult the replay store
        (duplicate is an idempotent no-op), and **enqueue regardless of age**,
        marking anything beyond the window as stale so it can be triaged rather
        than trusted as timely. The message timestamp is inside the signed body,
        so it is integrity-protected and safe to carry forward as metadata.
      tags: [webhooks]
      x-nt-side-effect: ingest
      security:
        - whatsappSignature: []
      requestBody:
        required: true
        description: |
          Meta's Cloud API payload, passed through as received. Deliberately
          untyped here: this contract does not own Meta's schema, and pinning a
          copy of it would rot. It is Zod-parsed at the boundary against the
          shapes the handler actually reads, and anything unrecognised is logged
          and ignored rather than failing the acknowledgement.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: |
            Acknowledged. Always returned once the signature verifies, even if
            the payload is one this handler ignores — Meta retries anything else,
            and a retry storm is worse than a no-op.
        '401':
          description: |
            Signature missing, malformed, or failing verification — `NT-INT-001`.

            **One code for every signature failure, deliberately.** Telling an
            unauthenticated caller whether their signature was absent, the wrong
            length, or simply wrong hands them an oracle for free. The
            distinction is logged, not returned.

            Note what this status does NOT cover: a correctly-signed message
            that is merely old. See the freshness note on this operation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://neoting.com/problems/NT-INT-001
                title: Unauthenticated
                status: 401
                code: NT-INT-001
                detail: Webhook signature missing or invalid.
                traceId: 01J8XN2ZQ5R7TQ9E3M4K6P

# ============================================================================
# COMPONENTS
# ============================================================================

components:

  securitySchemes:
    workspaceSession:
      type: apiKey
      in: cookie
      name: nt_session
      description: |
        The accountant workspace session. Device-bound, rotating refresh token,
        absolute lifetime ≤ 30 days, idle timeout ≤ 24 h (Governance §11.1).
        Every state-changing browser request is additionally CSRF-protected.

    portalSession:
      type: http
      scheme: bearer
      description: |
        A client's OTP portal session. Scoped to exactly the items the granting
        chase requested and nothing else — enforced by RLS via
        `app.session_scope = 'delegated_upload'` plus the granted item IDs
        (Governance §5.2), not by the handler.

        The link and OTP are deliberately forwardable to whoever physically holds
        the document; the audit trail records *requested-from* separately from
        *uploaded-by-delegated-session*.

    oauth2:
      type: oauth2
      description: |
        Public API clients (D10, 185-vote gap). The same API, scoped — there is
        no second door. `documents:write` grants proposal creation and never
        approval: approving is a human UI action by definition.
      flows:
        authorizationCode:
          authorizationUrl: https://api.neoting.neovogent.com/v1/oauth/authorize
          tokenUrl: https://api.neoting.neovogent.com/v1/oauth/token
          scopes:
            documents:read: Read documents, extractions and processing logs
            documents:write: Create documents and propose document actions
            proposals:read: Read action proposals

    whatsappSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: |
        Meta's HMAC-SHA256 over the raw request body. Verified before the body is
        parsed, with a ±5 minute timestamp tolerance and replay rejection.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `pageInfo.nextCursor`. Never construct one by hand.
      schema: { type: string }

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

    BusinessIdFilter:
      name: businessId
      in: query
      required: false
      description: |
        Restrict to one client workspace. **Omit it to span every workspace the
        caller can see** — that is what makes cross-client questions a filter
        rather than a second endpoint.

        This narrows; it never widens. RLS decides the ceiling, so passing an id
        the caller cannot access returns an empty page or `404`, never someone
        else's data.
      schema: { type: string }

    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }

    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string }

    ChaseId:
      name: chaseId
      in: path
      required: true
      schema: { type: string }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUIDv4, unique per logical operation. Replays return the
        original result rather than acting twice. Reusing a key with a different
        payload is `409` — that is a client bug, and failing loudly beats
        silently doing the wrong thing to someone's books.
      schema: { type: string, format: uuid }

  headers:
    TraceId:
      description: |
        The trace id born at this entry point and carried through every service,
        job, model call and adapter call it causes. Quote it in a bug report and
        the whole journey is one Journey Inspector lookup.
      schema: { type: string }
    RateLimitLimit:
      description: Requests permitted in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: The request failed schema validation at the boundary.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://neoting.com/problems/NT-VAL-001
            title: Validation failed
            status: 400
            code: NT-VAL-001
            detail: One or more fields are invalid.
            traceId: 01J8XN2ZQ5R7TQ9E3M4K6P
            errors:
              - field: byteSize
                message: must be a positive integer

    Unauthenticated:
      description: No valid session or token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Forbidden:
      description: |
        Authenticated, but not permitted. Used for permission failures on
        resources the caller can see. A resource the caller cannot see returns
        `404` instead — the difference matters, because `403` would confirm the
        record exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotFound:
      description: |
        No such record — or one the caller's RLS context does not reach. The two
        are deliberately indistinguishable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    IdempotencyConflict:
      description: This `Idempotency-Key` was already used with a different payload.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    RateLimited:
      description: Rate limit exceeded (Governance §11.8).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InternalError:
      description: |
        Unexpected. The response carries the trace id and nothing else — internal
        detail and PII never reach a client (Governance §3).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ---- errors -----------------------------------------------------------

    Problem:
      type: object
      description: RFC 7807 problem detail. The only error shape this API returns.
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
          description: |
            Points at the runbook page for `code`. Governance §13.4 requires
            every code to have one before it passes review, so this link is never
            dead.
          examples: ['https://neoting.com/problems/NT-ING-004']
        title: { type: string, description: Short, human, stable for the code. }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail:
          type: string
          description: What went wrong for this occurrence, in plain English, never blaming the user.
        traceId: { type: string }
        errors:
          type: array
          description: Field-level detail on validation failures.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    ErrorCode:
      type: string
      description: |
        Stable machine code. Families per Governance §13.4: `ING` ingest ·
        `EXT` extraction · `RTE` routing · `BNK` banking · `CHS` chase ·
        `PUB` publishing · `INT` integration auth · `OTP` portal auth, plus the
        cross-cutting `VAL`, `AUTH`, `PRM`, `PRP`, `IDM` and `RATE` families.

        The enum below is the exhaustive list **for this surface**. It grows as
        surfaces land, and each addition ships with its runbook page in the same
        PR.
      pattern: '^NT-[A-Z]{3,4}-[0-9]{3}$'
      enum:
        - NT-VAL-001   # request failed schema validation
        - NT-AUTH-001  # no valid session
        - NT-AUTH-002  # session expired
        # ONE code for every login failure — unknown email, wrong password,
        # wrong TOTP. Splitting them would hand an account-enumeration oracle
        # to whoever is guessing (same stance as NT-INT-001's single code).
        - NT-AUTH-003  # login credentials did not verify
        - NT-PRM-001   # actor lacks permission for this action kind
        - NT-IDM-001   # idempotency key reused with a different payload
        - NT-RATE-001  # rate limit exceeded
        # The generic 500. Governance §3 requires an unknown error to log with
        # its traceId and return a generic body — but `Problem.code` is
        # required, so without this there was no legal code for the one
        # response every service eventually returns. Found by Abdullah in #10.
        - NT-SRV-001   # unexpected internal error
        # Inbound webhook auth. NOT NT-AUTH-001, which means "no valid session":
        # a webhook has no session, and reusing the session code would make an
        # NT-AUTH-001 alert ambiguous between "a user's login broke" and "Meta's
        # signature failed" — two incidents with nothing in common. Governance
        # §13.4 already reserves the INT family for integration auth.
        - NT-INT-001   # inbound webhook signature verification failed
        - NT-INT-002   # inbound webhook verify-token mismatch (Meta GET handshake)
        - NT-ING-001   # declared size over the channel cap
        - NT-ING-002   # declared MIME type not allowed for this channel
        - NT-ING-003   # byte hash mismatch between client and storage
        - NT-ING-004   # file rejected by sanitisation (magic-byte mismatch, password-protected, virus)
        - NT-ING-005   # upload intent expired before completion
        - NT-RTE-001   # document could not be routed and is in the Unrouted queue
        - NT-EXT-001   # extraction failed on every rung of the ladder
        # Portal auth — the OTP family Governance §13.4 reserves. Same
        # single-code stance as NT-AUTH-003 and NT-INT-001: a caller who
        # failed to verify learns nothing about why, so a guesser cannot
        # learn which links exist. The two codes split on WHEN, not why:
        # -001 is entry (link + OTP), -002 is an issued session going stale.
        - NT-OTP-001   # portal link token or OTP failed verification
        - NT-OTP-002   # portal session missing, invalid or expired
        # Publishing (PUB family). SoT Stage 10: an item enters a publish
        # batch only with Total + Supplier + Category present; refusing at
        # proposal time beats publishing half-coded books.
        - NT-PUB-001   # document not publishable — mandatory fields missing
        - NT-PRP-001   # unknown action kind
        - NT-PRP-002   # approve attempted before the review was opened
        - NT-PRP-003   # proposal expired
        - NT-PRP-004   # rendered summary hash no longer matches
        - NT-PRP-005   # proposal already executed
        - NT-PRP-006   # payload not executable against current state
        # The model runtime (MDL family, Governance §9). Deliberately NOT `CHS`
        # or a `CHAT` family: these fire when the MODEL failed, not when the
        # chase engine or the chat feature did, and an alert that cannot tell
        # "Bedrock is down" from "a chase failed to send" is two incidents
        # sharing one pager. §9.3 is explicit that chat degrades to an honest
        # error rather than a guess, so each of these is a real response a user
        # will read, not an internal-only condition.
        - NT-MDL-001   # every tier of the model chain failed or the breaker is open
        - NT-MDL-002   # the practice's daily AI budget is spent
        - NT-MDL-003   # model output failed its schema twice (§9.2 retry exhausted)
        - NT-MDL-004   # agent loop hit a turn/time cap, or oscillated (§9.5)

    # ---- chat (Governance §9) ---------------------------------------------

    ChatIntent:
      type: string
      description: |
        What the model decided the utterance was. This is the model's entire
        expressive range on this surface — an intent outside the enum fails the
        response schema, which is the §9.5 allow-list applied to interpretation
        the same way `ProposalKind` applies it to action.
      enum:
        - GENERAL          # understood nothing actionable — the honest "here's what I can do"
        - LIVE_MISSING     # show unmatched transactions with no paperwork
        - LIVE_CHASE       # draft a chase for the missing items
        - LIVE_RULE        # parse a coding rule
        - LIVE_PUBLISH     # draft a publish batch
        - SHOW_INBOX       # navigation — the inbox, optionally narrowed
        - REVIEW_DOCUMENT  # navigation — one named document
        - GROUNDED_ANSWER  # a question answered from this client's records (§9.4)
        - SCOPE_REFUSAL    # outside document-pipeline data — refused, not attempted (§9.4)

    ChatHistoryTurn:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content:
          type: string
          maxLength: 4000
          description: |
            Verbatim prior turn. The server wraps every `user` turn as untrusted
            content before it reaches a model (§9.6) — a conversation carries no
            more authority than a document body does.

    ChatTurnRequest:
      type: object
      required: [utterance]
      properties:
        utterance:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the accountant typed or dictated.
        businessId:
          type: string
          description: |
            The client workspace in scope, when one is attached. Grounding and
            every draft resolve against this and nothing else; RLS decides
            whether the caller may see it at all.
        history:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ChatHistoryTurn' }
          description: |
            Recent conversation, oldest first. Capped here **and** server-side at
            the §9.5 turn limit — the cap is not a client courtesy.

    ChatNavigation:
      type: object
      description: Where the UI should go, for the navigation intents.
      properties:
        businessId: { type: string }
        documentId: { type: string }
        statusFilter:
          type: string
          description: A document status to narrow the inbox to.

    ChatRecordReference:
      type: object
      required: [type, id, label]
      description: |
        One record a grounded answer stood on (§9.4). Present so the UI can link
        it and the audit log can reconstruct what the answer was derived from —
        an answer whose sources cannot be named is not a grounded answer.
      properties:
        type:
          type: string
          enum: [document, chase, bankTransaction, publish, extraction]
        id: { type: string }
        label:
          type: string
          description: Human-readable, already client-scoped — e.g. "Currys receipt, 9 Aug".

    ChatUsage:
      type: object
      required: [model, tier, inputTokens, outputTokens, latencyMs]
      description: |
        What this turn cost and what served it (§9.7). Returned rather than only
        logged because the budget warning is a thing the user must be able to
        see coming, and because "which tier answered me" is the honest signal
        when a degrade has happened mid-conversation (§9.3).
      properties:
        model:
          type: string
          description: The pinned model ID that actually served the turn.
        tier:
          type: string
          enum: [judgment, workhorse, mechanical]
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cachedInputTokens:
          type: integer
          description: Prompt-cache hits on the stable prefix. Zero means the cache missed.
        latencyMs: { type: integer }
        degraded:
          type: boolean
          description: True when the judgment tier failed and a lower tier answered.
        budgetRemainingPence:
          type: integer
          x-nt-money: true
          description: What is left of the practice's daily AI budget after this turn.
        budgetWarning:
          type: boolean
          description: True from 80% of the daily budget onward (§9.7).

    ChatTurn:
      type: object
      required: [intent, reply, usage, modelVersion, promptVersion]
      description: |
        One interpreted turn. `draft` is the only field that can lead to a state
        change, and only by the caller taking it to `POST /action-proposals` —
        nothing here has changed anything.
      properties:
        intent: { $ref: '#/components/schemas/ChatIntent' }
        reply:
          type: string
          description: |
            The words to show. For `GROUNDED_ANSWER` with no supporting records
            this is exactly `Information not available in this client's records.`
            and nothing else (§9.4).
        draft:
          allOf:
            - $ref: '#/components/schemas/CreateActionProposalRequest'
          description: |
            A ready-to-send proposal request the UI renders as a card. Typed as
            the real request body on purpose: the model cannot draft something
            `POST /action-proposals` would reject, because there is no shape
            here that endpoint does not already accept.
        navigation: { $ref: '#/components/schemas/ChatNavigation' }
        references:
          type: array
          items: { $ref: '#/components/schemas/ChatRecordReference' }
        usage: { $ref: '#/components/schemas/ChatUsage' }
        modelVersion:
          type: string
          description: |
            Pinned model ID plus config revision. Recorded on every turn so a
            historical answer is reproducible (§9.8).
        promptVersion:
          type: string
          description: The system prompt's version, from the repo — never a dashboard value (§9.8).

    # ---- pagination -------------------------------------------------------

    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass back as `cursor`. Null when there is no next page.
        hasMore: { type: boolean }

    # ---- enums (verbatim from prisma/schema.prisma) ------------------------

    DocumentChannel:
      type: string
      description: How the document arrived. Mirrors the Prisma `DocumentChannel` enum exactly.
      enum: [WEB_UPLOAD, EMAIL, WHATSAPP, SMS_PORTAL, CHAT_UPLOAD, STRUCTURED_IMPORT, API]

    Inbox:
      type: string
      description: |
        `UNROUTED` is a real, visible queue — not an error state. Anything the
        router cannot place lands there for one-click assignment, and nothing is
        ever silently dropped (SoT Stage 1).
      enum: [COSTS, SALES, UNROUTED]

    DocumentState:
      type: string
      description: |
        `READY` requires Total + Supplier + Category at minimum, plus any
        admin-configured mandatory fields. `REJECTED` and `FAILED` are
        first-class and always carry a reason and a retry affordance.
      enum: [RECEIVED, PROCESSING, TO_REVIEW, READY, PUBLISHED, ARCHIVED, REJECTED, FAILED]

    DocumentType:
      type: string
      enum: [INVOICE, RECEIPT, CREDIT_NOTE, STATEMENT, OTHER]

    ProposalState:
      type: string
      enum: [CREATED, REVIEWED, APPROVED, EXECUTED, CANCELLED, EXPIRED]

    WorkspaceRole:
      type: string
      description: |
        Mirrors the Prisma `WorkspaceRole` enum exactly (checked mechanically,
        like the document enums). Roles are always set per account (SoT §3.3);
        fine-grained permissions are checked at call sites, never inferred
        from the role name.
      enum: [PRACTICE_ADMIN, CLIENT_ADMIN, PRACTICE_STANDARD, BUSINESS_ADMIN, USER_ADMIN, BUSINESS_STANDARD]

    SplitMode:
      type: string
      description: |
        `AUTO_SPLIT` is the standard for batch PDFs, not an add-on — competitors'
        users report losing hours a week splitting 30–100-page scans by hand
        (46 backlog votes).
      enum: [SINGLE_DOCUMENT, PAGE_PER_DOCUMENT, AUTO_SPLIT]

    ProvenanceClass:
      type: string
      description: |
        Source of Truth §13.3 makes this **visible by default**, in one
        consistent visual language across chat cards, inboxes, tables and the
        portal overlay. It is carried on every extracted value for exactly that
        reason — a UI cannot show what the API does not send.
      enum:
        - HUMAN_CONFIRMED   # a person typed or confirmed it; outranks everything
        - DETERMINISTIC     # a rule or validator produced it
        - AI_SUGGESTED      # a model produced it; always paired with confidence

    ChaseDetectionEngine:
      type: string
      description: |
        The five detection engines of SoT §4 Stage 8, mirrored from the Prisma
        enum exactly. The demo push implements UNMATCHED_TRANSACTION only; the
        other four are contract-real and engine-pending.
      enum: [UNMATCHED_TRANSACTION, SUPPLIER_STATEMENT_GAP, STATEMENT_PERIOD_GAP, LEDGER_TXN_NO_ATTACHMENT, EXPECTED_RECURRING_MISSING]

    ChaseState:
      type: string
      description: |
        Mirrors the Prisma `ChaseState` enum exactly. `CLOSED_RECEIVED` is the
        auto-close: an arriving document matched the chased items and nobody
        had to do anything — the beat the product sells.
      enum: [DETECTED, PROPOSED, APPROVED, SENT, REMINDED, ESCALATED, CLOSED_RECEIVED, CLOSED_UNAVAILABLE, CLOSED_DISMISSED, CLOSED_SUPPRESSED]

    MatchState:
      type: string
      description: |
        Mirrors the Prisma `MatchState` enum exactly. `CONFIRMED` is reachable
        only through an approved `bank.confirm-match` proposal.
      enum: [UNMATCHED, SUGGESTED, CONFIRMED, EXCLUDED]

    MatchKind:
      type: string
      description: Mirrors the Prisma `MatchKind` enum exactly.
      enum: [EXACT, PROBABILISTIC, PARTIAL_PAYMENT, BATCH_PAYMENT, CREDIT_NOTE]

    PublishMode:
      type: string
      description: Mirrors the Prisma `PublishMode` enum exactly.
      enum: [MANUAL, AUTO, AI]

    PublishState:
      type: string
      description: |
        Mirrors the Prisma `PublishState` enum exactly. A `FAILED` publish
        always carries `failureCode` and `failureMessage`; retry is a new
        `publish.batch` proposal over the failed item, never a replay.
      enum: [QUEUED, SUCCEEDED, FAILED]

    RuleTier:
      type: string
      description: |
        The four-tier priority ladder (SoT Stage 3): user rules beat
        payment-method rules beat supplier/customer defaults beat account
        defaults. Mirrors the Prisma `RuleTier` enum exactly.
      enum: [USER, PAYMENT_METHOD, SUPPLIER_CUSTOMER, ACCOUNT_DEFAULT]

    # ---- auth (METH Stage 1) ----------------------------------------------

    SessionCreateRequest:
      type: object
      required: [email, password, totp]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        totp:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            Six digits. Demo builds verify against a fixed code
            (`OTP_MODE=demo`); real TOTP replaces the verifier, not this shape.

    Me:
      type: object
      description: |
        The context header payload (SoT §13.3). `businesses` is what the
        caller's RLS context can actually see — the practice's clients for
        practice staff, the single workspace for a business login.
      required: [user, practice, role, businesses]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            firstName: { type: [string, 'null'] }
            lastName: { type: [string, 'null'] }
        practice:
          description: Null for a business-only login — there is no practice above them.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: 'null'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        businesses:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }

    # ---- documents --------------------------------------------------------

    DocumentSummary:
      type: object
      description: |
        The row shape for inbox lists and tables. Header fields are a projection
        of the accepted extraction, denormalised so a list of 500 rows does not
        reach into extraction JSON 500 times.
      required: [id, businessId, inbox, state, channel, originalFilename, receivedAt, retryable]
      properties:
        id: { type: string }
        businessId: { type: string }
        inbox: { $ref: '#/components/schemas/Inbox' }
        state: { $ref: '#/components/schemas/DocumentState' }
        docType:
          oneOf:
            - $ref: '#/components/schemas/DocumentType'
            - type: 'null'
        channel: { $ref: '#/components/schemas/DocumentChannel' }
        originalFilename: { type: string }
        receivedAt: { type: string, format: date-time }
        supplierName: { type: [string, 'null'] }
        customerName: { type: [string, 'null'] }
        documentDate:
          type: [string, 'null']
          format: date
          description: A calendar date, not an instant. UK d/m/y is disambiguated at parse time, never here.
        dueDate: { type: [string, 'null'], format: date }
        currency:
          type: [string, 'null']
          description: ISO 4217. Locked to document evidence; a change raises an alert rather than silently flipping (SoT Stage 2).
          pattern: '^[A-Z]{3}$'
        totalPence:
          type: [integer, 'null']
          description: Gross total in pence.
          x-nt-money: true
        taxPence:
          type: [integer, 'null']
          x-nt-money: true
        reference: { type: [string, 'null'] }
        categoryCode: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        projectRef: { type: [string, 'null'] }
        parentDocumentId:
          type: [string, 'null']
          description: Set when this document came out of an auto-split batch.
        failureCode:
          type: [string, 'null']
          description: Never null when `state` is `REJECTED` or `FAILED`.
        failureMessage:
          type: [string, 'null']
          description: Plain English, and specific. "Password-protected PDF" — not "processing error".
        retryable:
          type: boolean
          description: |
            Whether the Rejected/Failed view should offer a retry. Retrying is
            itself an ActionProposal of kind `document.reprocess`.
        archivedAt: { type: [string, 'null'], format: date-time }

    Document:
      description: |
        The full record: everything in the summary, plus routing evidence and the
        accepted extraction with per-field confidence and provenance.
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          required: [byteHash, mimeType, byteSize, createdAt, updatedAt]
          properties:
            mimeType:
              type: string
              description: The type decided by magic-byte sniffing, never the one the client declared.
            byteSize: { type: integer }
            byteHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            perceptualHash:
              type: [string, 'null']
              description: |
                Catches the same paper photographed twice, cropped or rotated —
                one of the multi-signal dedupe nets (SoT Stage 6).
            submitterUserId: { type: [string, 'null'] }
            submitterLabel:
              type: [string, 'null']
              description: |
                Display name for a submitter with no login — someone who emails or
                WhatsApps documents is recorded as Document Owner without ever
                being provisioned as a user.
            receivedLocal:
              type: [string, 'null']
              description: The Europe/London wall-clock time as received, kept for evidence alongside the UTC instant.
            routingDecision:
              type: [object, 'null']
              additionalProperties: true
              description: |
                How this document reached this workspace: which rule matched, or
                which model inferred the addressee and from what evidence. Null
                when the sender identity matched exactly and no inference was
                needed. This is the "show the working" payload for the routing
                step (§13.3).
            routingConfidence:
              type: [number, 'null']
              minimum: 0
              maximum: 1
              description: |
                Model-reported, for display and triage only. It never gates
                execution — thresholds come from eval measurement, not from a
                model's opinion of itself (Governance §9.5).
            pageRange:
              type: [string, 'null']
              description: Which pages of the parent this document came from, e.g. "4-6".
            acceptedExtraction:
              oneOf:
                - $ref: '#/components/schemas/Extraction'
                - type: 'null'
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ExtractedField:
      type: object
      description: |
        One extracted value and everything needed to judge it. Never send a bare
        value: without `provenance` the §13.3 mandate is unbuildable, and without
        `confidence` the review queue cannot rank by uncertainty.
      required: [value, provenance]
      properties:
        value:
          description: |
            The value. Monetary fields are integers in pence; dates are
            `YYYY-MM-DD`; everything else is a string. Null when extraction found
            nothing — which is different from extracting an empty string.
          type: [string, integer, boolean, 'null']
        provenance: { $ref: '#/components/schemas/ProvenanceClass' }
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Present when `provenance` is `AI_SUGGESTED`; null otherwise.
        source:
          type: [string, 'null']
          description: |
            What produced it — the extractor, the rule id, or the guidance id.
            This is what the hover explanation cites.
        boundingBox:
          type: [object, 'null']
          description: |
            Where on the page it was read, normalised 0–1. Drives the editable
            OCR overlay: the client taps the wrong number on the image and fixes
            it in five seconds rather than the document bouncing back.
          properties:
            page: { type: integer, minimum: 1 }
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
        wasCorrected:
          type: boolean
          default: false
          description: |
            A human overrode the extracted value. The original is retained in the
            extraction history — corrections are new rows, never overwrites.

    Extraction:
      type: object
      required: [id, documentId, fields, extractorKind, isAccepted, createdAt]
      properties:
        id: { type: string }
        documentId: { type: string }
        fields:
          type: object
          description: |
            Field name → `ExtractedField`. Header fields per SoT Stage 2:
            `docType`, `documentDate`, `dueDate`, `supplierName`, `customerName`,
            `currency`, `poNumber`, `totalPence`, `taxPence`, `vatNumber`,
            `reference`, `paymentMethod`, `cardLast4`, `supplierBankDetails`
            (167-vote gap; also powers fraud checks).
          additionalProperties: { $ref: '#/components/schemas/ExtractedField' }
        lineItems:
          type: array
          description: |
            **Standard on every document (D17), never a metered add-on.** This is
            the single biggest competitive displacement lever — accountants leave
            incumbents specifically because line items cost extra there.
          items:
            type: object
            properties:
              description: { $ref: '#/components/schemas/ExtractedField' }
              quantity: { $ref: '#/components/schemas/ExtractedField' }
              totalPence: { $ref: '#/components/schemas/ExtractedField', x-nt-money: true }
              taxPence: { $ref: '#/components/schemas/ExtractedField', x-nt-money: true }
        extractorKind:
          type: string
          description: Which implementation behind `DocumentExtractor` produced this.
          examples: ['textract.analyze-expense', 'vision.workhorse', 'vision.judgment', 'manual']
        ladderRung:
          type: [string, 'null']
          description: |
            Which rung of the vision escalation ladder this came from — Textract,
            then workhorse vision, then judgment vision, then human. Each rung
            fires only below threshold, so the cheapest capable extractor always
            goes first (D20/D28).
        modelVersion:
          type: [string, 'null']
          description: Pinned model id. Recorded so any historical decision is reproducible (Governance §9.8).
        promptVersion: { type: [string, 'null'] }
        overallConfidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        validatorResults:
          type: [object, 'null']
          additionalProperties: true
          description: |
            Deterministic validator output from `packages/validators` — VAT
            arithmetic to ±1p, VRN checksum then the HMRC check-VAT-number API,
            date plausibility with UK d/m/y disambiguation, currency agreement.
            **A validator failure sends the document to To Review regardless of
            model confidence.** Rules beat model opinions.
        isAccepted:
          type: boolean
          description: At most one extraction per document is accepted; it is what the document's header projection is built from.
        keyedByUserId:
          type: [string, 'null']
          description: |
            Set when a human typed the data — the manual-entry bypass that stays
            available while OCR runs. Such values are marked *keyed by [name]* in
            the UI and carry `HUMAN_CONFIRMED` provenance.
        createdAt: { type: string, format: date-time }

    DocumentEvent:
      type: object
      description: One stage of the processing log.
      required: [id, stage, outcome, createdAt]
      properties:
        id: { type: string }
        stage:
          type: string
          examples: ['sanitise', 'split', 'classify', 'route', 'extract', 'validate', 'dedupe', 'match']
        outcome: { type: string, examples: ['ok', 'failed', 'escalated', 'skipped'] }
        durationMs: { type: [integer, 'null'] }
        traceId: { type: [string, 'null'] }
        detail:
          type: [object, 'null']
          additionalProperties: true
          description: |
            Stage-specific evidence — the model and prompt version used,
            confidence, validator results, the routing decision. Redacted for
            callers without admin rights.
        createdAt: { type: string, format: date-time }

    FileAccess:
      type: object
      required: [url, expiresAt, mimeType, byteSize]
      properties:
        url: { type: string, format: uri }
        expiresAt:
          type: string
          format: date-time
          description: Minutes away, not hours. Re-request rather than caching it.
        mimeType: { type: string }
        byteSize: { type: integer }
        filename: { type: string }

    # ---- upload -----------------------------------------------------------

    DocumentUploadRequest:
      type: object
      required: [businessId, channel, filename, mimeType, byteSize]
      properties:
        businessId:
          type: string
          description: |
            The client workspace this document belongs to. Required even for
            channels that could infer it, because guessing at ingest time is what
            produces the multi-entity misrouting this product exists to fix.
        channel: { $ref: '#/components/schemas/DocumentChannel' }
        filename: { type: string, maxLength: 255 }
        mimeType:
          type: string
          description: |
            Declared, and treated as a hint only. Magic-byte sniffing decides the
            real type after the bytes land — extensions are never trusted
            (Governance §11.4).
        byteSize:
          type: integer
          minimum: 1
          description: |
            Checked against the channel cap here and again by the presigned
            policy. Photos should be compressed client-side first, which is why
            the 25 MB client cap is effectively never reached by a camera.
        splitMode:
          $ref: '#/components/schemas/SplitMode'
          default: AUTO_SPLIT
        description:
          type: string
          maxLength: 500
          description: |
            Free text from the submitter. Present on **web upload too** — the
            160-vote mobile-parity gap. Untrusted content: wrapped before any
            model sees it.
        documentOwnerContactId:
          type: [string, 'null']
          description: Who this document belongs to, when it is not the uploader.

    DocumentUpload:
      type: object
      required: [uploadId, upload, expiresAt]
      properties:
        uploadId: { type: string }
        upload:
          type: object
          required: [method, url, headers]
          properties:
            method: { type: string, enum: [PUT] }
            url: { type: string, format: uri }
            headers:
              type: object
              additionalProperties: { type: string }
              description: Send these verbatim with the PUT. The presigned signature covers them.
        expiresAt:
          type: string
          format: date-time
          description: After this the intent is dead and `NT-ING-005` is returned on completion.
        maxBytes:
          type: integer
          description: The cap the storage policy will enforce independently of the API.

    # ---- action proposals -------------------------------------------------

    ProposalKind:
      type: string
      description: |
        The action-kind registry **for this surface**. It is an allow-list, not a
        suggestion: a chat context physically lacks tools outside its registered
        kinds (Governance §9.5), and an unknown kind is rejected with
        `NT-PRP-001`.

        METH Stage 2 (issue #120) added the four demo-push kinds — `chase.send`,
        `publish.batch`, `bank.confirm-match` and `rule.create` — registered as
        `ProposalNotImplementedError` stubs until their stages land executors.
        Later surfaces still add `rule.activate`, `policy.activate` and
        `setting.change`.

        **Open question for Shakib — deliberately not decided here.** The OTP
        portal's editable-overlay correction (SoT Stage 8.4) is a client fixing a
        misread number on their own just-uploaded receipt, in a car park, before
        the document has ever been reviewed. Putting Read review → Approve in
        front of that would be the wrong reading of §8.2, which governs the
        accountant workspace. But it touches the Review → Approve enforcement
        path, which is a stop-and-ask item, so this contract does not settle it —
        it lands with the portal surface in pass 3.
      enum:
        - document.route          # assign an unrouted document, optionally teaching the router
        - document.update-coding  # confirm or change supplier, category, totals, VAT treatment
        - document.move-business  # move between entities, with the addressee-mismatch warning
        - document.reprocess      # retry a failed extraction or ingest
        - document.reject         # reject with a visible reason
        - document.split          # re-split a batch by page range
        - document.archive        # archive or unarchive
        - chase.send              # send composed chase SMS; review shows every message verbatim
        - publish.batch           # publish reviewed documents to the ledger; review shows the server-computed preview
        - bank.confirm-match      # confirm a suggested document ↔ transaction match
        - rule.create             # create a coding rule; it activates only on approval

    CreateActionProposalRequest:
      description: |
        A discriminated union on `kind`. The discriminator sits on the union
        itself — not on a wrapper — so the generated client narrows `payload` from
        `kind` alone, and an unknown `kind` fails at the boundary rather than
        reaching a handler that has to guess.
      oneOf:
        - $ref: '#/components/schemas/RouteProposalRequest'
        - $ref: '#/components/schemas/UpdateCodingProposalRequest'
        - $ref: '#/components/schemas/MoveBusinessProposalRequest'
        - $ref: '#/components/schemas/ReprocessProposalRequest'
        - $ref: '#/components/schemas/RejectProposalRequest'
        - $ref: '#/components/schemas/SplitProposalRequest'
        - $ref: '#/components/schemas/ArchiveProposalRequest'
        - $ref: '#/components/schemas/ChaseSendProposalRequest'
        - $ref: '#/components/schemas/PublishBatchProposalRequest'
        - $ref: '#/components/schemas/BankConfirmMatchProposalRequest'
        - $ref: '#/components/schemas/RuleCreateProposalRequest'
      discriminator:
        propertyName: kind
        mapping:
          document.route: '#/components/schemas/RouteProposalRequest'
          document.update-coding: '#/components/schemas/UpdateCodingProposalRequest'
          document.move-business: '#/components/schemas/MoveBusinessProposalRequest'
          document.reprocess: '#/components/schemas/ReprocessProposalRequest'
          document.reject: '#/components/schemas/RejectProposalRequest'
          document.split: '#/components/schemas/SplitProposalRequest'
          document.archive: '#/components/schemas/ArchiveProposalRequest'
          chase.send: '#/components/schemas/ChaseSendProposalRequest'
          publish.batch: '#/components/schemas/PublishBatchProposalRequest'
          bank.confirm-match: '#/components/schemas/BankConfirmMatchProposalRequest'
          rule.create: '#/components/schemas/RuleCreateProposalRequest'

    ProposalRequestBase:
      type: object
      properties:
        businessId:
          type: [string, 'null']
          description: The workspace the action applies to. Null only for practice-level actions.

    RouteProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: document.route }
            payload: { $ref: '#/components/schemas/RoutePayload' }

    UpdateCodingProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: document.update-coding }
            payload: { $ref: '#/components/schemas/UpdateCodingPayload' }

    MoveBusinessProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: document.move-business }
            payload: { $ref: '#/components/schemas/MoveBusinessPayload' }

    ReprocessProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: document.reprocess }
            payload: { $ref: '#/components/schemas/ReprocessPayload' }

    RejectProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: document.reject }
            payload: { $ref: '#/components/schemas/RejectPayload' }

    SplitProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: document.split }
            payload: { $ref: '#/components/schemas/SplitPayload' }

    ArchiveProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: document.archive }
            payload: { $ref: '#/components/schemas/ArchivePayload' }

    ChaseSendProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: chase.send }
            payload: { $ref: '#/components/schemas/ChaseSendPayload' }

    PublishBatchProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: publish.batch }
            payload: { $ref: '#/components/schemas/PublishBatchPayload' }

    BankConfirmMatchProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: bank.confirm-match }
            payload: { $ref: '#/components/schemas/BankConfirmMatchPayload' }

    RuleCreateProposalRequest:
      allOf:
        - $ref: '#/components/schemas/ProposalRequestBase'
        - type: object
          required: [kind, payload]
          properties:
            kind: { const: rule.create }
            payload: { $ref: '#/components/schemas/RuleCreatePayload' }

    RoutePayload:
      type: object
      required: [documentId, inbox]
      properties:
        documentId: { type: string }
        inbox: { $ref: '#/components/schemas/Inbox' }
        toBusinessId:
          type: [string, 'null']
          description: Set when assigning an Unrouted document to a workspace.
        teachRouterForSender:
          type: boolean
          default: false
          description: |
            "Always route this sender to American Burger." Creates the routing
            rule as part of the same approved action, so teaching the router is
            never a separate forgotten step.

    UpdateCodingPayload:
      type: object
      description: |
        Confirming a document's coding is explicitly named in SoT §8.2 as a
        state change, which is why it is here and not a `PATCH`.
      required: [documentId, fields]
      properties:
        documentId: { type: string }
        fields:
          type: object
          properties:
            docType: { $ref: '#/components/schemas/DocumentType' }
            supplierName: { type: string }
            customerName: { type: string }
            documentDate: { type: string, format: date }
            dueDate: { type: string, format: date }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            totalPence: { type: integer, x-nt-money: true }
            taxPence: { type: integer, x-nt-money: true }
            reference: { type: string }
            categoryCode: { type: string }
            description: { type: string }
            projectRef: { type: string }
        createRuleFromCorrection:
          type: boolean
          default: false
          description: |
            One-tap rule creation from a correction — "apply this to future
            Google Ads items?" (SoT Stage 3). The rule is created under this same
            approval; it never activates from an unapproved correction.

    MoveBusinessPayload:
      type: object
      required: [documentId, toBusinessId]
      properties:
        documentId: { type: string }
        toBusinessId: { type: string }
        acknowledgedAddresseeMismatch:
          type: boolean
          default: false
          description: |
            The review surfaces "Invoice says AMERICAN BURGER LTD; current
            workspace is COSMO RESTAURANTS LTD" when the addressee disagrees with
            the destination (73-vote multi-entity misrouting gap). Approving
            without this flag set is refused when a mismatch was detected — the
            warning has to be answered, not scrolled past.

    ReprocessPayload:
      type: object
      required: [documentIds]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }
          description: |
            Bulk retry from the Rejected/Failed view. Batched deliberately: the
            review card for "retry 43 extractions" is more useful than 43
            separate approvals.
        fromStage:
          type: [string, 'null']
          description: Re-run from this stage onward. Null re-runs the whole pipeline.

    RejectPayload:
      type: object
      required: [documentIds, reason]
      properties:
        documentIds:
          type: array
          minItems: 1
          items: { type: string }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Surfaced verbatim in the Rejected view. A rejection without a reason is not a rejection.

    SplitPayload:
      type: object
      required: [documentId, pageRanges]
      properties:
        documentId: { type: string }
        pageRanges:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[0-9]+(-[0-9]+)?$' }
          examples: [['1-3', '4', '5-9']]

    ArchivePayload:
      type: object
      required: [documentIds, archived]
      properties:
        documentIds:
          type: array
          minItems: 1
          items: { type: string }
        archived: { type: boolean }
        clearPublishingData:
          type: boolean
          default: false
          description: |
            Unarchiving a published item asks whether to clear its publishing
            data, because that decides whether it can be republished (SoT
            Stage 11).

    ChaseSendPayload:
      type: object
      description: |
        Everything Read review must show: every SMS byte-for-byte as it will
        send, and who receives it. If the sent text ever differs from this
        payload, the Review → Approve guarantee is broken (SoT §8.2).
        Composition is server-side; this payload is its output, never
        free-typed by a caller.
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [recipientE164, body, transactionIds]
            properties:
              recipientContactId:
                type: [string, 'null']
                description: The contact being asked, when one is on file. The audit trail records requested-from separately from uploaded-by.
              recipientE164:
                type: string
                pattern: '^\+[1-9][0-9]{6,14}$'
              body:
                type: string
                minLength: 1
                maxLength: 500
                description: The exact SMS, portal link included. Shown verbatim at review; sent verbatim on approval.
              transactionIds:
                type: array
                minItems: 1
                items: { type: string }
                description: |
                  The unmatched bank transactions this message chases. They
                  become the chase's items and the portal session's grant —
                  one message per client, grouped, not one text per receipt
                  (SoT Stage 8.2).

    PublishBatchPayload:
      type: object
      description: |
        `preview` is computed by the server at proposal time — item count,
        gross and VAT in pence — and is exactly what Read review renders
        ("Publish 43 bills to Xero — gross £84,925, VAT £10,402"). Execution
        re-validates that each item still meets the minimum (Total + Supplier
        + Category); an item that no longer does refuses with `NT-PUB-001`
        rather than publishing half-coded books.
      required: [documentIds, preview]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }
        integrationId:
          type: [string, 'null']
          description: The ledger connection to publish through. Null uses the business's single active integration.
        preview:
          type: object
          required: [itemCount, grossPence, vatPence]
          properties:
            itemCount: { type: integer, minimum: 1 }
            grossPence:
              type: integer
              x-nt-money: true
            vatPence:
              type: integer
              x-nt-money: true

    BankConfirmMatchPayload:
      type: object
      description: |
        Confirms a suggested document ↔ transaction match. Execution writes
        the `matches` row and flips the transaction's `matchState` — integer
        pence, server-side. Suggestion arithmetic is display-tier and nothing
        here trusts it.
      required: [transactionId, documentId, matchKind]
      properties:
        transactionId: { type: string }
        documentId: { type: string }
        matchKind: { $ref: '#/components/schemas/MatchKind' }
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: |
            The suggesting engine's score, recorded for display and triage.
            It never gates execution — the human's approval is the decision
            (Governance §9.5).

    RuleCreatePayload:
      type: object
      description: |
        Creates a coding rule (SoT Stage 3). The executor writes the `rules`
        row with this proposal recorded as `actionProposalId` — a rule never
        activates from an unapproved utterance, however plain-English the
        request was.
      required: [tier, sets]
      properties:
        tier: { $ref: '#/components/schemas/RuleTier' }
        scopeKey:
          type: [string, 'null']
          description: |
            What the tier matches on — for SUPPLIER_CUSTOMER, the exact
            supplier name ("Bidfood"). The demo push honours single-tier
            exact supplier match; the four-tier engine consumes this same
            shape.
        conditions:
          type: [object, 'null']
          additionalProperties: true
          description: |
            Amount bands, line-item keywords, document type, uploader,
            project — the richer conditions of the full engine. Null for a
            plain supplier match.
        sets:
          type: object
          minProperties: 1
          description: The coding fields this rule sets when it wins.
          properties:
            categoryCode: { type: string }
            vatTreatment: { type: string }
            description: { type: string }
          additionalProperties: false

    ActionProposal:
      type: object
      required: [id, kind, state, payloadHash, createdAt, expiresAt]
      properties:
        id: { type: string }
        businessId: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/ProposalKind' }
        state: { $ref: '#/components/schemas/ProposalState' }
        payload:
          type: object
          additionalProperties: true
          description: What was proposed, as submitted.
        payloadHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 over the canonical payload. Written to the audit event on approval.
        renderedSummaryHash:
          type: [string, 'null']
          description: Null until the review has been opened.
        createdByUserId: { type: [string, 'null'] }
        createdByModel:
          type: [string, 'null']
          description: |
            Set when a model proposed this. A model may create a proposal and
            may never approve one — the two fields are never both a model.
        createdAt: { type: string, format: date-time }
        reviewedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Set by the review endpoint alone. While this is null the server
            refuses approval, whatever the UI shows.
        approvedByUserId: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        executedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
        policyProposalId:
          type: [string, 'null']
          description: |
            Set on automated executions, naming the standing policy they ran
            under. A standing automation runs without a per-item proposal only
            because the policy itself was approved through this same contract
            (Governance §10.5).
        outcome:
          type: [object, 'null']
          additionalProperties: true
          description: What actually changed. Populated on execution.
        traceId: { type: [string, 'null'] }

    ProposalReview:
      type: object
      description: |
        The expansion behind [Read review]: every field a rule will set, the full
        text of every SMS about to be sent, the itemised list behind a bulk
        publish. Nothing summarised away — the point of the pattern is that the
        human has seen what they are approving.
      required: [proposal, renderedSummary, renderedSummaryHash, reviewedAt]
      properties:
        proposal: { $ref: '#/components/schemas/ActionProposal' }
        renderedSummary:
          type: object
          description: |
            The review card content. Typed loosely here on purpose: the precise
            shape is the Review → Approve primitive in
            `packages/component-grammar`, the next Sprint-0 contract, and
            duplicating it here would create two sources of truth for the same
            thing. This contract owns the transport and the hash; the grammar
            owns the shape.
          required: [title, sections]
          properties:
            title:
              type: string
              description: What the action is and its scope — "Publish 43 bills to Xero — gross £84,925, VAT £10,402".
            sections:
              type: array
              items:
                type: object
                additionalProperties: true
            warnings:
              type: array
              description: |
                Anything the human must answer rather than scroll past — an
                addressee mismatch, a rule that overlaps an existing one, a
                recipient with no verified mobile.
              items:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  requiresAcknowledgement: { type: boolean, default: false }
        renderedSummaryHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: |
            SHA-256 of exactly what was rendered above. Echo it back to approve.
            This pair — payload hash and rendered-summary hash — is what makes
            "what was approved is what was shown" provable rather than asserted.
        reviewedAt: { type: string, format: date-time }

    # ---- chases (SoT Stage 8 — METH Stage 2, issue #120) --------------------

    ChaseItem:
      type: object
      description: |
        One thing being chased — today always an unmatched bank transaction
        (engine (a)); the shape survives when the other engines land. The same
        shape serves the accountant's chase detail and the portal's item list,
        because they are the same facts shown at two trust levels.
      required: [transactionId, amountPence, bookedAt, received]
      properties:
        transactionId: { type: string }
        merchantName: { type: [string, 'null'] }
        descriptionRaw:
          type: [string, 'null']
          description: The raw bank descriptor — the client's own bank line, safe at both trust levels.
        amountPence:
          type: integer
          x-nt-money: true
          description: Signed pence, as the feed records it. Negative is money out.
        bookedAt: { type: string, format: date-time }
        received:
          type: boolean
          description: |
            A matching document has arrived for this item. When every item is
            received the chase auto-closes as `CLOSED_RECEIVED`.

    ChaseSummary:
      type: object
      description: The row shape for the Chases workspace list.
      required: [id, businessId, detectionEngine, state, itemCount, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        detectionEngine: { $ref: '#/components/schemas/ChaseDetectionEngine' }
        state: { $ref: '#/components/schemas/ChaseState' }
        recipientContactId: { type: [string, 'null'] }
        itemCount:
          type: integer
          minimum: 1
          description: How many items this chase covers — grouped per client, never one text per receipt.
        actionProposalId:
          type: [string, 'null']
          description: The approved `chase.send` proposal that created it. Null only for states before PROPOSED.
        firstSentAt: { type: [string, 'null'], format: date-time }
        lastSentAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        closedReason: { type: [string, 'null'] }
        closedByDocumentId:
          type: [string, 'null']
          description: The arriving document that auto-closed it, when one did (SoT Stage 8.5).
        createdAt: { type: string, format: date-time }

    Chase:
      description: 'The full record: items, messages, closure.'
      allOf:
        - $ref: '#/components/schemas/ChaseSummary'
        - type: object
          required: [items, messages]
          properties:
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/ChaseItem' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChaseMessage' }

    ChaseMessage:
      type: object
      required: [id, chaseId, channel, body, createdAt]
      properties:
        id: { type: string }
        chaseId: { type: string }
        channel:
          type: string
          examples: ['sms']
        body:
          type: string
          description: |
            The exact text shown at review and the exact text sent. If these
            ever differ, the Review → Approve guarantee is broken.
        recipientE164: { type: [string, 'null'] }
        deliveryState: { type: [string, 'null'] }
        sentAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    SmsOutboxMessage:
      type: object
      description: |
        One recorded SMS as the demo outbox renders it — the stand-in for the
        client's phone. Reads from the same rows the real sender will write.
      required: [id, businessId, toE164, body, sentAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        toE164: { type: string }
        body: { type: string }
        deliveryState: { type: [string, 'null'] }
        chaseId: { type: [string, 'null'] }
        portalUrl:
          type: [string, 'null']
          description: |
            The portal link carried in `body`, extracted so the outbox screen
            can make it tappable. Demo affordance — a real phone taps the text
            itself.
        sentAt: { type: string, format: date-time }

    # ---- portal (SoT Stage 8.3 — METH Stage 2, issue #120) ------------------

    PortalSessionCreateRequest:
      type: object
      required: [linkToken, otp]
      properties:
        linkToken:
          type: string
          description: From the SMS link. Stateless — HMAC over the chase id and expiry.
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            Six digits. Demo builds verify against a fixed code
            (`OTP_MODE=demo`); real verification replaces the verifier, not
            this shape.

    PortalSession:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer …` on every portal call.'
        expiresAt: { type: string, format: date-time }

    PortalContext:
      type: object
      description: |
        Everything this session may see — and the whole of it. The RLS
        delegated-session policies enforce the boundary below the handler.
      required: [businessName, items, expiresAt]
      properties:
        businessName:
          type: string
          description: Display only — whose books the paperwork belongs to.
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChaseItem' }
        expiresAt: { type: string, format: date-time }

    PortalUploadRequest:
      type: object
      required: [filename, mimeType, byteSize]
      properties:
        filename: { type: string, maxLength: 255 }
        mimeType:
          type: string
          description: Declared, and treated as a hint only — magic-byte sniffing decides the real type after the bytes land (Governance §11.4).
        byteSize:
          type: integer
          minimum: 1
          description: Checked against the 25 MB client-channel cap here and again by the presigned policy.
        transactionId:
          type: [string, 'null']
          description: |
            The chased transaction this upload answers, when the client picked
            one. Null lets extraction decide — the pipeline compares the
            extraction against every open item regardless (SoT Stage 8.5).

    # ---- publishing (SoT Stage 10 — METH Stage 2, issue #120) ---------------

    Publish:
      type: object
      description: One publish attempt for one document. Batches fan out to one row per item, so per-item failure is visible per item.
      required: [id, businessId, documentId, mode, state, attachmentSent, createdAt]
      properties:
        id: { type: string }
        businessId: { type: string }
        documentId: { type: string }
        integrationId: { type: [string, 'null'] }
        mode: { $ref: '#/components/schemas/PublishMode' }
        state: { $ref: '#/components/schemas/PublishState' }
        externalRef:
          type: [string, 'null']
          description: The ledger's own reference — set on success, the proof the books moved.
        attachmentSent:
          type: boolean
          description: The source image travelled with the bill (SoT Stage 10). False on a ledger that refused it, never silently.
        actionProposalId:
          type: [string, 'null']
          description: The `publish.batch` proposal this ran under.
        failureCode:
          type: [string, 'null']
          description: Never null when `state` is `FAILED`.
        failureMessage: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }

    # ---- banking (SoT Stage 7 — METH Stage 2, issue #120) -------------------

    BankTransaction:
      type: object
      description: |
        The provider-agnostic normalised schema (SoT Stage 7). Amounts are
        signed integer pence exactly as the feed records them.
      required: [id, businessId, accountId, bookedAt, amountPence, currency, descriptionRaw, matchState, chaseSuppressed]
      properties:
        id: { type: string }
        businessId: { type: string }
        accountId: { type: string }
        bookedAt: { type: string, format: date-time }
        amountPence:
          type: integer
          x-nt-money: true
          description: Signed. Negative is money out.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        descriptionRaw: { type: string }
        merchantName: { type: [string, 'null'] }
        classification: { type: [string, 'null'] }
        balanceAfterPence:
          type: [integer, 'null']
          x-nt-money: true
        matchState: { $ref: '#/components/schemas/MatchState' }
        chaseSuppressed:
          type: boolean
          description: |
            Bank-originated lines with no paperwork to chase — SERVICE CHARGE,
            STRIPE PAYOUT (SoT Stage 7). Suppressed lines never enter chase
            detection; the flag is visible so "why isn't this chased" has an
            answer on the screen.

    # ---- businesses (METH Stage 2, issue #120) ------------------------------

    BusinessSummary:
      type: object
      description: |
        What the context header, the client switcher and the Clients list
        render. `GET /me` answers "who am I"; this answers "what is waiting".
      required: [id, name, counts]
      properties:
        id: { type: string }
        name: { type: string }
        tradingName: { type: [string, 'null'] }
        counts:
          type: object
          description: One cheap aggregate over documents, grouped by state. Unrouted documents belong to no business and are counted nowhere here.
          required: [toReview, ready, failed]
          properties:
            toReview: { type: integer, minimum: 0 }
            ready: { type: integer, minimum: 0 }
            failed:
              type: integer
              minimum: 0
              description: REJECTED and FAILED together — the Rejected/Failed view's badge.

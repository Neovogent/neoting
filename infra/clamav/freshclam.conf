# freshclam configuration for the nt/clamav `freshclam-publish` task ONLY.
# The scanner container never runs freshclam (Dockerfile header; clamav.tf
# signature-bucket banner). One pass, then the entrypoint publishes to S3.

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
# Official CDN. No private mirror: the private S3 prefix IS our mirror, and
# this task is the only thing in the environment that talks to clamav.net.
DatabaseMirror database.clamav.net
# Incremental .cdiff updates against the bundle the entrypoint pulled down
# first. This is what keeps six runs a day at ~1 MB each rather than 250 MB.
ScriptedUpdates yes
# Run once and exit: the schedule is EventBridge Scheduler's job, not a
# long-lived freshclam daemon's.
Checks 1
Foreground yes
LogTime yes
LogSyslog no
# Keep .cld as produced; recompressing on every run is CPU for no benefit.
CompressLocalDatabase no
# bytecode.cvd is small and the scanner enables Bytecode, so publish it.
Bytecode yes
ConnectTimeout 60
ReceiveTimeout 300
# A stale database is a loud failure in the logs, not a silent one.
TestDatabases yes

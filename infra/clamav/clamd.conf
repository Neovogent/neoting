# clamd configuration for nt/clamav (Governance §11.4 step 4).
# Every value here is a decision; the defaults are only kept where they are
# stated. clamd.conf(5) for the vocabulary.

# --- Where and how it listens ------------------------------------------------
# TCP only. The workers reach this over the VPC (Cloud Map name, port 3310);
# the security group admits the app security group and nothing else.
TCPSocket 3310
TCPAddr 0.0.0.0
# No LocalSocket: nothing in this container scans files, and clamdscan --ping
# (the health check) speaks TCP through this same config.

Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
# Logs to stdout/stderr → awslogs. No file, no syslog.
LogTime yes
LogClean no
LogVerbose no
LogSyslog no
ExtendedDetectionInfo yes

# --- The INSTREAM budget -----------------------------------------------------
# StreamMaxLength is the hard cap on one INSTREAM upload. 100M = the largest
# per-channel cap in channels.ts (accountant_upload / vault). Anything bigger
# is refused by the pipeline's step 3 before it ever reaches step 4; a
# request over this limit here gets "INSTREAM size limit exceeded. ERROR",
# which the client treats as unavailable (fail closed), never as clean.
# ⚠ If a channel cap is ever raised above 100 MB this number moves in the
# same PR, together with clamav.tf's visibility/memory notes.
StreamMaxLength 100M
MaxScanSize 400M
MaxFileSize 100M
# Archive recursion limits — the ZIP-bomb caps in zip-safety.ts run AFTER
# this step, so clamd needs its own: these are ClamAV's recommended values.
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxHTMLNoTags 8M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M
# Over-limit is NOT an alert. A legitimately huge archive that exceeds a cap
# is "scanned as far as the limits allow"; refusing it here would turn a size
# question into a malware verdict the submitter cannot act on.
AlertExceedsMax no
# Encrypted archives/documents are NOT alerts either: password-protected files
# are the PDF guard's job (step 6), which refuses them with the right
# plain-English reason. A virus verdict on a locked zip is the wrong message.
AlertEncrypted no
AlertEncryptedArchive no
AlertEncryptedDoc no

# --- What it scans -------------------------------------------------------------
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail yes
ScanArchive yes
ScanHTML yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000
HeuristicAlerts yes
# No PUA and no phishing-URL alerts: both are noisy on real paperwork
# (invoices full of links) and a false positive here is a client's receipt
# refused with "virus".
DetectPUA no
PhishingSignatures no
PhishingScanURLs no

# --- Timeouts and concurrency -------------------------------------------------
# 0.5 vCPU in staging (clamav.tf): a few threads, long patience.
MaxThreads 4
MaxQueue 32
# The client's whole-scan deadline is CLAMD_TIMEOUT_MS (180 s default); clamd's
# own read timeouts sit inside that so a stalled socket is cleaned up here too.
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 60
MaxConnectionQueueLength 64
# Scan length budget per request (ms). Above this clamd stops and returns what
# it has; the client sees OK/FOUND for what was scanned.
MaxScanTime 150000

# --- Database handling ------------------------------------------------------
# Check for a changed database every 10 min on its own, as well as on RELOAD
# from the entrypoint's hourly sync.
SelfCheck 600
# ⚠ Sequential reload, deliberately. The default (concurrent) loads the new
# database beside the old one — two ~1.5 GB sets at once — and that is what
# OOM-kills a 4 GB task during an hourly refresh, presenting as "the image is
# broken". Sequential pauses scanning for the reload; the workers' client
# fails closed and BullMQ retries, so a document waits a minute instead of
# the task dying.
ConcurrentDatabaseReload no

# --- Hygiene ------------------------------------------------------------------
ExitOnOOM yes
FixStaleSocket yes
# clamd forks nothing here, but PID 1 handling is the task's initProcess.
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
LeaveTemporaryFiles no

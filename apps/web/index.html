<!doctype html>
<!-- No theme class is hardcoded here any more: the inline script below puts one
     on before the first paint. See the comment on it. `App.tsx` then keeps the
     class in sync with settings.theme for the rest of the session.

     ⚠ Do not write the literal head or script tags inside a comment in this
     file. `@vitejs/plugin-react` injects its refresh preamble immediately after
     the FIRST occurrence of the opening head tag in the raw source, so a
     mention of it in prose swallows the preamble into the comment and the dev
     server serves an app that never mounts ("can't detect preamble"). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠ The theme, applied BEFORE THE FIRST PAINT. This has to be inline and
         synchronous, and it has to be here: `/src/main.tsx` is a module and
         modules are deferred by definition, so anything React does happens
         after the browser has already painted the page — which is the white
         flash a dark-mode user got on every single reload.

         It is a hand-inlined copy of `resolveInitialTheme()` from
         `src/lib/theme-preference.ts`, and the duplication is deliberate: an
         import here would be the deferred module we are trying to get ahead of.
         The key 'nt.theme' and the class 'light' are the two things that must
         stay in step with that file.

         No stored choice means LIGHT — the owner's ruling (5 Sep 2026), so
         prefers-color-scheme is deliberately not consulted here; the switcher
         is the only way into dark. `localStorage` THROWS in a browser with
         site data blocked, so the read is wrapped and a throw is treated as
         no stored choice. The app is never allowed to fail to render over a
         preference. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('nt.theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
        } catch (e) {
          /* Storage blocked — treat as no stored choice. */
        }
        document.documentElement.classList.toggle('light', theme === 'light');
      })();
    </script>
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) non-zero, so
         every pb-safe / pt-safe utility in index.css is inert without it.
         `interactive-widget=resizes-content` asks the browser to shrink the
         layout when the on-screen keyboard opens rather than scrolling the
         page under it; useVisualViewport() covers the engines that ignore it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- Installable on a home screen: standalone shell, icon, and a status bar that
         blends with the app rather than sitting as a white band on top of it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neo Accounting" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- One theme colour, the light ground: the app defaults to light for
         everyone (owner's ruling, 5 Sep 2026) and the OS preference no longer
         decides anything, so media-keyed pairs would paint a dark bar over a
         light app for every dark-OS visitor. The residual mismatch — a user
         who STORED dark gets a light bar — is the same class of gap the old
         pair had in the other direction, and fixing it means the inline
         script rewriting this tag; noted rather than done. -->
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <title>Neo Accounting</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

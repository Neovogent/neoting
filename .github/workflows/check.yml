# NEOTING — the nine-stage CI pipeline (Governance §14; order matters, every
# stage blocks). This REPLACES the bootstrap thin CI (Team Guideline §8.7)
# wholesale: same file, same required status check, entirely new contents.
#
# The filename and the final job name are load-bearing. `.github/scripts/
# apply-branch-protection.sh` pins the required status check to the literal
# name `check` and its comment points at this file. Rename either one without
# updating that script in the same PR and the merge gate silently stops
# applying — the PR still shows ticks, they just no longer gate anything.
#
# ===========================================================================
# THE HONESTY CONTRACT — read this before you touch a guard
# ===========================================================================
# Most of the suites §14 requires do not exist yet. Every workspace package
# still ships S0 placeholders — `"test": "echo \"test: no tests yet (S0)\""` —
# and `turbo run test:e2e` exits 0 with "No tasks were executed" when NO
# package implements the task at all. Wire a stage straight onto those and it
# reports a green tick for having run nothing, on every PR, for months. A green
# tick is believed. That is not a weak test, it is a false statement about the
# state of the product, and it is the failure mode this file exists to prevent.
#
# Two rules, deliberately pulling against each other:
#
#   1. A stage with no suite behind it NEVER claims to have passed. It is
#      skipped, its job or step name says NOT IMPLEMENTED, and every run prints
#      a debt table naming the stage, its governance clause and the exact
#      condition that turns it on. It does not fail the build: a gate that
#      blocks all work on the absence of code nobody has written yet gets
#      commented out within a week, and then we have neither the gate nor the
#      honesty.
#   2. A stage that IS implemented can never silently do nothing. Turbo's
#      "No tasks were executed" line is treated as a failure, not a pass
#      (see the stage runner in `verify`).
#
# The flip is automatic and does NOT require editing this file. Readiness is
# PROBED from the repository: a script counts as real when a workspace package
# defines it and its command is not `echo`. Delete the echo, write the suite,
# and the stage turns itself on — that is the whole guard. Stage 9 is the one
# exception, because it needs infrastructure that does not exist yet; it has a
# single DEPLOY_READY line to flip, with the preconditions listed at the job.
#
# ---------------------------------------------------------------------------
# Kept from the thin CI, and why
# ---------------------------------------------------------------------------
#   · draft-PR skip — §3 says draft-from-first-push. Running nine stages on
#     every WIP push burns the free tier for nothing. Still fires on
#     `ready_for_review`, which is the moment it matters.
#   · concurrency cancel-in-progress — but ONLY for pull_request. A cancelled
#     PR run costs a re-run; a cancelled `main` run can leave a half-applied
#     migration or a half-rolled deploy. Pushes to main queue, never cancel.
#   · commitlint on the PR title — the squash commit takes the title (G4), so
#     the title is the thing that must be a valid conventional commit.
#   · fetch-depth: 0 — commitlint needs history, and stages 7 and 8 need the
#     diff range against the base commit.

name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Re-run the pipeline — and therefore stage 9 — against `main` without
  # inventing a commit to do it. Two real needs, both met on 14 Aug 2026:
  # GitHub silently created NO run for the merge of #31 (zero runs for that
  # SHA, confirmed via the API), leaving `main` built but never deployed with
  # nothing to re-run; and a failed deploy otherwise has no retry that is not
  # an empty commit. `terraform.yml` already carries this for the same reason.
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Same connection strings as .env.example, character for character. CI has no
  # native Postgres competing for 5432, so 5433 is not forced here — it is
  # chosen, so that the string you debug locally is the string that ran in CI.
  # One fewer difference between the environment that failed and the one you
  # are looking at.
  #
  # TWO URLS, and the split is the tenancy guarantee (issue #17). `neoting` owns
  # the schema and is a superuser, so an application connected as it bypasses RLS
  # entirely — even with FORCE ROW LEVEL SECURITY — and every policy in
  # prisma/sql/rls.sql becomes decorative. CI must run the application half as
  # the role production uses, or the isolation tests here prove nothing.
  DATABASE_URL: postgresql://nt_app:nt_app_local@localhost:5433/neoting?schema=public
  DIRECT_URL: postgresql://neoting:neoting@localhost:5433/neoting?schema=public
  REDIS_URL: redis://localhost:6379
  TZ: Europe/London

jobs:
  # =========================================================================
  # 0 · readiness — the probe that keeps the rest of this file honest.
  #
  # Runs in ~15 seconds on the preinstalled toolchain (no node setup, no
  # install). Everything downstream reads its outputs.
  # =========================================================================
  readiness:
    name: 0 · readiness probe
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      typecheck: ${{ steps.probe.outputs.typecheck }}
      lint: ${{ steps.probe.outputs.lint }}
      lint_rules: ${{ steps.probe.outputs.lint_rules }}
      test: ${{ steps.probe.outputs.test }}
      build: ${{ steps.probe.outputs.build }}
      e2e: ${{ steps.probe.outputs.e2e }}
      eval: ${{ steps.probe.outputs.eval }}
      eval_required: ${{ steps.probe.outputs.eval_required }}
      deploy: ${{ steps.probe.outputs.deploy }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe which suites actually exist
        id: probe
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # The probe must fail LOUD, never fail quiet. A broken probe answers
          # "nothing is implemented", which would silently switch off a suite
          # that does exist — the same class of lie in the other direction.
          command -v jq >/dev/null 2>&1 || {
            echo "::error title=Readiness probe broken::jq is not available on this runner. The probe cannot classify workspace scripts and refuses to guess."
            exit 1
          }

          # Workspace packages only. The ROOT package.json is excluded on
          # purpose: its scripts are `turbo run <task>` delegators. A delegator
          # is not evidence that a suite exists — it is the exact thing that
          # makes an empty pipeline look green.
          pkgs=$(git ls-files '*/package.json' | grep -v node_modules || true)
          [ -n "$pkgs" ] || {
            echo "::error title=Readiness probe broken::No workspace package.json files found. Either the checkout is empty or the workspace layout moved."
            exit 1
          }

          # A script counts as REAL when a package defines it and its command
          # is not `echo`. That is the whole rule, and it matches the S0
          # convention already in the repo ("test: no tests yet (S0)").
          # Consequence: writing a real suite flips CI on with no edit here.
          count_real() {
            local task="$1" n=0 body
            for p in $pkgs; do
              body=$(jq -r --arg t "$task" '.scripts[$t] // empty' "$p") || exit 1
              [ -n "$body" ] || continue
              case "$body" in
                echo*) continue ;;
              esac
              n=$((n + 1))
            done
            printf '%s' "$n"
          }

          yn() { [ "$1" -gt 0 ] && echo yes || echo no; }

          n_typecheck=$(count_real typecheck)
          n_lint=$(count_real lint)
          n_test=$(count_real test)
          n_build=$(count_real build)
          n_e2e=$(count_real test:e2e)
          n_eval=$(count_real test:eval)

          # §14.3 names five rule families that `pnpm lint` must enforce:
          # a11y, i18n-literal, money-type, module-boundary, unscoped-query.
          # None of them can exist without an ESLint config, so the absence of
          # one is a sufficient (and unfakeable) answer. When the config lands,
          # tighten this to grep for the five rule ids individually.
          if git ls-files | grep -qE '(^|/)(eslint\.config\.[cm]?[jt]s|\.eslintrc(\..+)?)$'; then
            lint_rules=yes
          else
            lint_rules=no
          fi

          # ------------------------------------------------------------------
          # Stage 9 is the ONE hand-set guard: no probe can detect "the deploy
          # target exists".
          #
          # FLIPPED TO yes ON 14 AUG 2026 for the api half; COMPLETED 15 AUG
          # 2026. What the flip list asked for, and where each item now stands:
          #   1. Dockerfile — apps/api/Dockerfile, one image for api + workers
          #      + migrate. Built and run on both amd64 and arm64 before merge.
          #      (apps/web is NOT containerised: Vercel owns it per G6.)
          #   2. ECS task definitions + services — services.tf, live since
          #      13 Aug. CI owns desired_count and raises it on first deploy.
          #   3. ALB + ACM — alb.tf / edge.tf, live. api.neoting.neovogent.com
          #      resolves through CloudFront to the ALB.
          #   4. A route from the migration runner to RDS — CLOSED, and closed
          #      the way it had to be: `ecs run-task` puts the migration INSIDE
          #      the VPC on the api service's own network configuration. RDS was
          #      never opened to the internet and must never be. The composition
          #      gap that blocked it (task gets DATABASE_HOST/PORT/NAME plus
          #      DB_MIGRATOR_*, Prisma wants DATABASE_URL/DIRECT_URL, and ECS
          #      cannot interpolate a secret into another variable) is closed in
          #      apps/api/src/db/migrate.ts.
          #   5. A health signal to roll back on — the api target group probes
          #      /healthz and both services carry deployment_circuit_breaker
          #      with rollback = true (services.tf). ECS owns the rollback.
          #
          # The INGEST_QUEUE=fixture caveat that used to live here was closed
          # on 17 Aug 2026: the task definitions set INGEST_QUEUE=bullmq,
          # OBJECT_STORE=s3 and IMAGE_NORMALISER=sharp (services.tf), so the
          # deployed api enqueues to Redis and workers actually consume it.
          # What a green stage 9 still does NOT prove: the email lane
          # (EMAIL_SOURCE stays `fixture` until the s3 poller has a service)
          # and qpdf PDF hardening (not in the image). The deploy summary
          # carries the honest remainder.
          # ------------------------------------------------------------------
          deploy=yes

          # Evals are REQUIRED when extraction, prompts, models, routing,
          # thresholds or packages/component-grammar changed (§14.7). Widen the
          # pattern as those modules land — a path that should have demanded
          # evals and did not is a governance miss, not a CI convenience.
          eval_required=no
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" || true)
          else
            changed=""
          fi
          if printf '%s\n' "$changed" | grep -qE \
            '^(services/extraction/|packages/component-grammar/|evals/|apps/api/src/modules/(extraction|ingestion-routing|rules-suggestions)/)|(^|/)(prompts?|models?|routing|thresholds)/'; then
            eval_required=yes
          fi

          {
            echo "typecheck=$(yn "$n_typecheck")"
            echo "lint=$(yn "$n_lint")"
            echo "lint_rules=$lint_rules"
            echo "test=$(yn "$n_test")"
            echo "build=$(yn "$n_build")"
            echo "e2e=$(yn "$n_e2e")"
            echo "eval=$(yn "$n_eval")"
            echo "eval_required=$eval_required"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

          # ------------------------------------------------------------------
          # The debt table. Printed on EVERY run, green or not, so that "we
          # have CI" is never mistaken for "we have coverage".
          # ------------------------------------------------------------------
          {
            echo "### CI stage readiness (Governance §14)"
            echo
            echo "| # | Stage | Real implementations | State |"
            echo "|---|-------|----------------------|-------|"
            echo "| 1 | install --frozen-lockfile | n/a | **runs** |"
            echo "| 2 | typecheck | $n_typecheck package(s) | $([ "$n_typecheck" -gt 0 ] && echo '**runs**' || echo '**NOT IMPLEMENTED**') |"
            echo "| 3 | lint | $n_lint package(s), rule set present: $lint_rules | $([ "$lint_rules" = yes ] && echo '**runs**' || echo '**runs, but enforces none of the five §14.3 rule families**') |"
            echo "| 4 | test (unit + integration) | $n_test package(s) | $([ "$n_test" -gt 0 ] && echo '**runs**' || echo '**NOT IMPLEMENTED** — only the SQL tenancy check is real today') |"
            echo "| 5 | build | $n_build package(s) | $([ "$n_build" -gt 0 ] && echo '**runs**' || echo '**NOT IMPLEMENTED**') |"
            echo "| 6 | test:e2e (+ axe, tenancy suite) | $n_e2e package(s) | $([ "$n_e2e" -gt 0 ] && echo '**runs**' || echo '**NOT IMPLEMENTED — SKIPPED**') |"
            echo "| 7 | test:eval | $n_eval package(s) | $([ "$n_eval" -gt 0 ] && echo '**runs**' || echo '**NOT IMPLEMENTED — SKIPPED**') (required by this diff: $eval_required) |"
            echo "| 8 | security (audit + secret scan) | n/a | **runs** |"
            echo "| 9 | deploy | n/a | $([ "$deploy" = yes ] && echo '**runs — migrate, api, workers**' || echo '**NOT IMPLEMENTED — SKIPPED**') |"
            echo
            echo "A stage marked NOT IMPLEMENTED did **not** run and proves nothing."
            echo "It turns itself on the moment a workspace package defines the script"
            echo "with a command that is not \`echo\` — no change to this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotations, so the debt is visible on the run header and not only
          # for whoever scrolls to the summary.
          [ "$n_test" -gt 0 ]  || echo "::warning title=Stage 4 not implemented::No workspace package defines a real \`test\` script — §14.4 (unit + integration) is not being enforced."
          [ "$n_e2e" -gt 0 ]   || echo "::warning title=Stage 6 not implemented::No \`test:e2e\` script exists — the blocking tenancy suite and axe checks (§14.6, §15.3, §15.4) are not running in CI."
          [ "$n_eval" -gt 0 ]  || echo "::warning title=Stage 7 not implemented::No \`test:eval\` script exists — extraction thresholds and the adversarial injection corpus (§15.5) are not gating merges."
          [ "$lint_rules" = yes ] || echo "::warning title=Stage 3 incomplete::No ESLint config in the repo — a11y, i18n-literal, money-type, module-boundary and unscoped-query (§14.3) are unenforced."
          if [ "$deploy" = yes ]; then
            echo "::notice title=Stage 9 deploys the real ingest lane::Migrations, api and workers deploy; INGEST_QUEUE=bullmq and OBJECT_STORE=s3 are set on the task definitions, so ingested documents survive a restart. Still fixture-mode by design: the email lane (EMAIL_SOURCE — the s3 poller has no ECS service yet) and qpdf PDF hardening (not in the image)."
          else
            echo "::warning title=Stage 9 not implemented::No deploy path exists yet. See the DEPLOY_READY block in check.yml."
          fi

  # =========================================================================
  # 1-5 · install → typecheck → lint → test → build.
  #
  # One job, because these five are strictly sequential over the same working
  # tree and splitting them would re-run `pnpm install` five times on a free
  # tier we are still counting minutes on. The stage boundaries are preserved
  # as named steps, and every one of them blocks the next.
  # =========================================================================
  verify:
    name: 1-5 · install, typecheck, lint, test, build
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Isolated data services per run (§14.4). A container that is created and
    # destroyed with the job IS the isolation — no shared staging database, no
    # leftover rows from the run before, nothing to clean up on failure.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neoting
          POSTGRES_PASSWORD: neoting
          POSTGRES_DB: neoting
          # Collation parity with docker-compose.yml and the staging parameter
          # group, so ORDER BY behaves identically in all three.
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neoting -d neoting"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ---- Stage runner ---------------------------------------------------
      # THE ANTI-NO-OP GUARD. Measured on this repo with turbo 2.1.3 on
      # 13 Aug 2026, because the obvious implementations are both wrong:
      #
      #   `turbo run test:eval`  → "Tasks: 0 successful, 0 total", exit 0, and
      #                            NO "no tasks" message anywhere in the output.
      #                            Grepping the log for a warning finds nothing
      #                            to grep.
      #   `turbo run test:e2e`   → "Tasks: 1 successful, 1 total", exit 0 —
      #                            and that one task is `build`, pulled in by
      #                            dependsOn. A green stage 6 that compiled the
      #                            contract package and ran zero tests.
      #
      # So the guard asks turbo directly, before running anything: `--dry=json`
      # lists every (package, task) pair with the command it would execute, and
      # reports "<NONEXISTENT>" where a package does not implement the task.
      # A stage may only run if at least one package implements THAT task with
      # a command that is not an S0 `echo` placeholder.
      - name: Install the stage runner (anti-no-op guard)
        run: |
          cat > "$RUNNER_TEMP/stage.sh" <<'SH'
          #!/usr/bin/env bash
          # Usage: stage.sh <task>
          #
          # ONE argument, and it is both the pnpm script and the turbo task —
          # they are the same string for every stage (typecheck, lint, test,
          # build), because `pnpm <x>` here is `turbo run <x>`.
          #
          # This took two parameters until an adversarial review caught that
          # all four callers pass one. Under `set -u` the unset "$2" aborted
          # the script before it ran anything, so stages 2, 3, 4 and 5 failed
          # on every run and the required `check` gate could never go green.
          # The irony was total: an anti-no-op guard that no-opped.
          set -euo pipefail
          task="$1"
          script="$task"

          real=$(pnpm exec turbo run "$task" --dry=json 2>/dev/null \
            | jq --arg t "$task" '[
                .tasks[]
                | select(.task == $t)
                | select(.command != "<NONEXISTENT>")
                | select(.command | startswith("echo") | not)
              ] | length')

          if [ "$real" -eq 0 ]; then
            echo "::error title=Stage would run nothing::No workspace package implements \`$task\` with a real command, yet the stage was enabled. Readiness and turbo disagree — that usually means turbo.json and the workspace have drifted. A stage that runs nothing must never report success."
            exit 1
          fi

          echo "$task: $real package(s) implement it"
          pnpm "$script"
          SH

      # ---- 1 · install ----------------------------------------------------
      - name: 1 · pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # The Prisma client is GENERATED code that is not committed, and stage 2
      # typechecks against it — `@prisma/client` exports nothing until this runs,
      # so without it typecheck fails with "has no exported member 'PrismaClient'"
      # and reads like a broken import rather than a missing build step. It runs
      # again before the migration; generating twice costs a second and is
      # cheaper than the ordering being implicit.
      - name: 1a · prisma generate (typecheck depends on generated types)
        run: pnpm --filter @neoting/api exec prisma generate

      # The PR title becomes the squash commit (G4), so it is the thing that
      # must be a valid conventional commit — not the individual commits.
      - name: 1b · commitlint (PR title)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint

      # ---- 2 · typecheck --------------------------------------------------
      - name: 2 · pnpm typecheck
        if: ${{ needs.readiness.outputs.typecheck == 'yes' }}
        run: bash "$RUNNER_TEMP/stage.sh" typecheck

      - name: 2 · typecheck — NOT IMPLEMENTED (no package has a real typecheck script)
        if: ${{ needs.readiness.outputs.typecheck != 'yes' }}
        run: echo "::warning title=Stage 2 skipped::Every typecheck script is an S0 placeholder. Nothing was type-checked."

      # ---- 3 · lint -------------------------------------------------------
      - name: 3 · pnpm lint
        if: ${{ needs.readiness.outputs.lint == 'yes' }}
        run: bash "$RUNNER_TEMP/stage.sh" lint

      - name: 3 · lint — NOT IMPLEMENTED (no package has a real lint script)
        if: ${{ needs.readiness.outputs.lint != 'yes' }}
        run: echo "::warning title=Stage 3 skipped::Every lint script is an S0 placeholder. Nothing was linted."

      # A green stage 3 today means "the contract checker ran", NOT "the five
      # rule families of §14.3 are enforced". Saying so out loud, every run,
      # is the difference between a gap and a false sense of one being covered.
      - name: 3b · required lint rules — NOT IMPLEMENTED
        if: ${{ needs.readiness.outputs.lint_rules != 'yes' }}
        run: |
          echo "::warning title=Stage 3 incomplete::No ESLint config exists, so none of a11y / i18n-literal / money-type / module-boundary / unscoped-query (§14.3) is enforced. The unscoped-query rule is the one that backs the tenancy guarantee (§5.2) — until it exists, scopedDb discipline is review-only."

      # These three ARE real, today, and they block. `migrate deploy` is the
      # only migration command allowed off a laptop (§5.3); the seed is what
      # keeps a fresh clone honest (§8.6), so a broken seed must break CI, not
      # the next person to clone; and tenancy-check.sql is the miniature of the
      # blocking suite §15.4 requires — 18 assertions that nt_app cannot escape
      # its business, run against a database whose RLS came from the real
      # migration.
      - name: 4a · prisma migrate deploy (isolated DB)
        run: |
          pnpm --filter @neoting/api exec prisma generate
          pnpm --filter @neoting/api exec prisma migrate deploy

      # The application's role, created AFTER the schema exists so the grants
      # have tables to attach to. `migrate deploy` connects on DIRECT_URL (the
      # owner); everything the application does connects on DATABASE_URL as this
      # role, which is not the owner, not a superuser, and has no BYPASSRLS.
      # Without this step the test stage cannot connect at all — which is the
      # correct failure, and far better than connecting as a superuser and
      # reporting green while every policy sits unused.
      - name: 4a2 · create the application role (nt_app)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -U neoting -d neoting -v ON_ERROR_STOP=1 -q < prisma/sql/app-role.sql

      - name: 4b · seed
        run: pnpm --filter @neoting/api exec prisma db seed

      # Executed inside the service container rather than via a runner-side
      # psql: same invocation as `pnpm db:tenancy-check`, and it does not
      # depend on which psql version the runner image happens to ship.
      - name: 4c · tenancy check (§15.4, blocking)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -U neoting -d neoting -v ON_ERROR_STOP=1 -q < prisma/sql/tenancy-check.sql

      # ---- 4 · test (unit + integration) ----------------------------------
      - name: 4 · pnpm test
        if: ${{ needs.readiness.outputs.test == 'yes' }}
        run: bash "$RUNNER_TEMP/stage.sh" test

      - name: 4 · test — NOT IMPLEMENTED (no package has a real test script)
        if: ${{ needs.readiness.outputs.test != 'yes' }}
        run: echo "::warning title=Stage 4 skipped::Every test script is an S0 placeholder. No unit or integration test ran. The only real assertion in this stage today is the SQL tenancy check below."

      # ---- 5 · build ------------------------------------------------------
      - name: 5 · pnpm build
        if: ${{ needs.readiness.outputs.build == 'yes' }}
        run: bash "$RUNNER_TEMP/stage.sh" build

      - name: 5 · build — NOT IMPLEMENTED (no package has a real build script)
        if: ${{ needs.readiness.outputs.build != 'yes' }}
        run: echo "::warning title=Stage 5 skipped::No package defines a build. Nothing was built, so stage 6 has nothing to run against."

      # The build must not mutate anything tracked. packages/contracts is
      # generated from openapi.yaml and its output is gitignored (§1.4), so a
      # tracked file changing here means the generator wrote outside its output
      # directory or someone committed generated code by hand — both of which
      # break the "spec is the source" contract (G7) quietly.
      - name: 5b · the build changed no tracked file
        if: ${{ needs.readiness.outputs.build == 'yes' }}
        run: |
          if ! git diff --quiet; then
            echo "::error title=Build mutated the working tree::pnpm build changed tracked files. Generated output belongs in an ignored directory; the spec is the source (G7)."
            git --no-pager diff --stat
            exit 1
          fi

      # Issue #90 untracked packages/contracts/src/generated — it had been
      # tracked despite the .gitignore rule, because an ignore rule has no
      # effect on already-tracked paths, and nothing noticed for months. This
      # step is what notices next time: a `git add -f`, or an ignore-rule edit
      # that stops matching, re-tracks the tree silently and 5b goes back to
      # asserting orval's byte-determinism across machines instead of its
      # stated job. Stage 5b checks the build's behaviour; this checks the
      # index, so it needs no build and runs unconditionally.
      - name: 5c · the generated contracts tree is not tracked
        run: |
          if git ls-files --error-unmatch packages/contracts/src/generated >/dev/null 2>&1 || [ -n "$(git ls-files packages/contracts/src/generated)" ]; then
            echo "::error title=Generated output is tracked again::packages/contracts/src/generated is generated from openapi.yaml (Governance §1.4) and was untracked in #90. Something re-added it to the index."
            git ls-files packages/contracts/src/generated | head -20
            exit 1
          fi

  # =========================================================================
  # 6 · e2e against the built app — includes axe checks and the blocking
  # tenancy suite (§14.6, §15.3, §15.4).
  #
  # The job NAME carries the truth, because the checks list is what people
  # actually read. Turn it on by giving `e2e` a real `test:e2e` script; this
  # file needs no edit.
  # =========================================================================
  e2e:
    name: ${{ needs.readiness.outputs.e2e == 'yes' && '6 · test:e2e' || '6 · test:e2e — NOT IMPLEMENTED (skipped)' }}
    needs: [readiness, verify]
    if: ${{ needs.readiness.outputs.e2e == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neoting
          POSTGRES_PASSWORD: neoting
          POSTGRES_DB: neoting
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U neoting -d neoting"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare the database
        run: |
          pnpm --filter @neoting/api exec prisma generate
          pnpm --filter @neoting/api exec prisma migrate deploy
          pnpm --filter @neoting/api exec prisma db seed

      # Browsers are ~400 MB and the download dominates the job. Cached by the
      # lockfile hash, because the Playwright version moves with it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @neoting/e2e exec playwright install --with-deps chromium

      # §14.6 says "against the built app", so this builds first rather than
      # running a dev server — a dev-server e2e proves the dev server works.
      - name: 6 · pnpm test:e2e
        env:
          # Twilio TEST credentials only (Guideline §8.4). If these are unset
          # the OTP flows fail loudly, which is correct: a silently skipped
          # onboarding test is the same lie this pipeline exists to avoid.
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_TEST_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_TEST_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          pnpm build
          pnpm test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          if grep -qE 'No tasks (were executed|to execute)' "$RUNNER_TEMP/e2e.log"; then
            echo "::error title=e2e ran nothing::turbo matched no test:e2e task. The stage reported success without executing a single test."
            exit 1
          fi

      - name: Upload the Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # =========================================================================
  # 7 · evals — REQUIRED when extraction, prompts, models, routing, thresholds
  # or packages/component-grammar changed (§14.7). Thresholds fail the build;
  # the adversarial injection corpus stays at 100% blocked (§15.5).
  #
  # When the suite does not exist and the diff demanded it, this job prints
  # exactly which paths demanded it and does not pretend otherwise. That is
  # deliberately not a hard failure YET: making it one today would block the
  # very PRs that create the extraction module, and a gate that blocks the work
  # it is meant to protect gets removed. It becomes a hard failure the moment
  # evals/ has a real `test:eval` script — from then on a relevant diff cannot
  # merge without passing thresholds.
  # =========================================================================
  eval:
    name: ${{ needs.readiness.outputs.eval == 'yes' && '7 · test:eval' || '7 · test:eval — NOT IMPLEMENTED (skipped)' }}
    needs: [readiness, verify]
    if: ${{ needs.readiness.outputs.eval == 'yes' && needs.readiness.outputs.eval_required == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 7 · pnpm test:eval
        env:
          # fixture replays the recorded corpus — evals must be deterministic
          # and must not spend Bedrock tokens per PR (§9.7, §13.5). Flip to
          # bedrock only for the scheduled calibration run, never for the merge
          # gate.
          AI_MODE: fixture
          EXTRACTION_MODE: fixture
        run: |
          set -euo pipefail
          pnpm test:eval 2>&1 | tee "$RUNNER_TEMP/eval.log"
          if grep -qE 'No tasks (were executed|to execute)' "$RUNNER_TEMP/eval.log"; then
            echo "::error title=evals ran nothing::turbo matched no test:eval task."
            exit 1
          fi

  # This exists so that "evals were required and did not run" is a visible line
  # in the checks list rather than an absence. Delete this job the day evals
  # become real — the `eval` job above covers it from then on.
  eval-debt:
    name: 7 · evals REQUIRED by this diff but NOT IMPLEMENTED
    needs: readiness
    if: ${{ needs.readiness.outputs.eval != 'yes' && needs.readiness.outputs.eval_required == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::warning title=Eval debt::This diff touches extraction / prompts / models / routing / thresholds / component-grammar. Governance §14.7 requires pnpm test:eval to pass before it merges. No eval suite exists, so nothing was measured — extraction accuracy, addressee routing and the adversarial injection corpus are all unverified for this change."
          {
            echo "### Stage 7 — eval debt"
            echo
            echo "This change is in eval-governed territory (§14.7) and **no evals ran**."
            echo "Merging it is a judgement call a human is making, not a check that passed."
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # 8 · security — `pnpm audit` (fail high/critical) + a secret scan of the
  # diff (§14.8). Both are real today and both block.
  #
  # Runs in parallel with 6 and 7 rather than after them. §14's ordering is
  # about what gates a merge, not about wall-clock sequence: nothing downstream
  # consumes the security result except the merge decision and stage 9, and
  # stage 9 `needs` this job explicitly. Learning about a critical advisory
  # twelve minutes earlier is worth more than a literal reading of the list.
  # =========================================================================
  security:
    name: 8 · security (audit + secret scan)
    needs: [readiness, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An advisory with no fix available will block merges. That is the point,
      # and the escape hatch is deliberately not in this file: add the GHSA to
      # `pnpm.auditConfig.ignoreGhsas` in package.json with a comment naming
      # the issue and the review date, so the exception is reviewed like code
      # instead of being buried in a workflow flag (§19).
      - name: 8a · pnpm audit (high + critical block)
        run: pnpm audit --audit-level high

      # gitleaks runs as a pinned container, not as gitleaks-action: the action
      # requires a paid licence key for organisation-owned repos, and a scanner
      # that fails open on a missing licence is worse than no scanner.
      #
      # --redact matters more than it looks: without it a hit prints the secret
      # into the run log, which turns "we found a leaked key" into "we leaked it
      # again, to a second place, with a permalink".
      - name: 8b · secret scan on the diff
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="${BASE_SHA}..${{ github.sha }}"
          fi
          echo "scanning $range"
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --log-opts="$range" \
                   --redact --no-banner --exit-code 1

  # =========================================================================
  # 9 · deploy (§14.9, §16).
  #
  # WHAT ALREADY WORKS AND IS NOT HERE: web previews. Vercel's own Git
  # integration builds a protected preview per PR (Guideline §7.2, R16) and
  # comments the URL. It is not a GitHub Actions job and duplicating it here
  # would give us two deploy paths to keep in step.
  #
  # WHAT THIS DEPLOYS: migrations, then the api, then workers — in that order,
  # which is the expand-contract order (§5.3). Both exclusions this job used to
  # carry were the same bug in two places, and both are now closed:
  #
  #   · MIGRATIONS RUN, as a one-off `ecs run-task` inside the VPC. That is the
  #     only correct mechanism — a GitHub runner has no route to RDS and must
  #     never be given one. The task definition receives DATABASE_HOST/PORT/NAME
  #     plus DB_MIGRATOR_USER/PASSWORD, while Prisma reads DATABASE_URL and
  #     DIRECT_URL; ECS cannot interpolate a `secrets` entry into another
  #     environment variable, so the join happens in-process
  #     (apps/api/src/db/migrate.ts) and the task command points at it.
  #   · WORKERS DEPLOY. Same gap on the other dependency: the task gets
  #     REDIS_HOST/PORT/TLS and a REDIS_AUTH_TOKEN secret while the app read
  #     REDIS_URL, which defaulted to redis://localhost:6379 — a worker would
  #     come up and reconnect-loop against itself forever, never crashing, never
  #     alarming, with the queue quietly growing. config/env.ts now derives the
  #     URL from those parts.
  #
  # ⚠ ORDER IS LOAD-BEARING AND MIGRATIONS FAIL THE JOB. The migration runs
  # BEFORE any service is updated, so a failed migration stops the deploy with
  # the old code still serving. That is only safe because §5.3 requires
  # migrations to be additive — a destructive migration would break the running
  # version between these two steps, which is exactly what expand-contract
  # exists to prevent.
  #
  # CLOSED 17 AUG 2026: INGEST_QUEUE=bullmq and OBJECT_STORE=s3 are now set on
  # the task definitions (services.tf), so the deployed api enqueues to Redis,
  # workers consume it, and sanitised bytes persist to S3. The remaining
  # fixture-mode lanes are the email poller (EMAIL_SOURCE — no ECS service for
  # worker/email-intake-main.js yet) and qpdf (not in the image); the summary
  # at the end of this job names them until they land.
  #
  # Production promote (§14.9 "one-click promote") is a GitHub Environment with
  # required reviewers — adding a reviewer to the `production` environment
  # converts an automatic deploy into a one-click one with no change to this
  # file. Auto-rollback re-points the service at the previous task definition,
  # which is why rollback is code-only (§16) and never a reversed migration.
  # =========================================================================
  deploy:
    name: ${{ needs.readiness.outputs.deploy == 'yes' && '9 · deploy (migrate → api → workers)' || '9 · deploy — NOT IMPLEMENTED (skipped)' }}
    needs: [readiness, verify, e2e, security]

    # ⚠ THE UPSTREAM RESULTS ARE CHECKED BY HAND HERE, AND THEY HAVE TO BE.
    # A job with `needs` normally carries an implicit `if: success()`. Writing
    # any `if:` REPLACES that implicit condition — so the obvious form,
    # `if: deploy == 'yes' && github.ref == ...`, would deploy a commit whose
    # build or security stage had just failed. Naming each result is what keeps
    # "main is always deployable" (§14) from meaning "main is always deployed".
    #
    # e2e is `!= 'failure'` rather than `== 'success'` because it is legitimately
    # SKIPPED today (no test:e2e suite exists — stage 6). The day it becomes
    # real, a failing e2e blocks the deploy without touching this line.
    #
    # ⚠ `always()` IS LOAD-BEARING AND IS NOT A CONTRADICTION OF THE ABOVE.
    # A job is skipped when any of its `needs` was SKIPPED, unless its `if`
    # calls a status function. Stage 6 (e2e) is legitimately skipped today —
    # no suite exists — so without `always()` this job could never run at all,
    # which is exactly what happened on the first attempt: the merge of #31
    # produced a green pipeline with the deploy quietly skipped.
    #
    # The `check` aggregator at the foot of this file carries the same
    # `always()` for the same reason, and says so. Reading one and not the
    # other is how this was missed.
    #
    # With `always()` the explicit result checks below are the ONLY thing
    # stopping a failed build from deploying — they are the safety, not
    # decoration.
    if: >-
      ${{ always()
          && needs.readiness.outputs.deploy == 'yes'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs.verify.result == 'success'
          && needs.security.result == 'success'
          && needs.e2e.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Named here so the environment's protection rules (required reviewers,
    # deployment branch policy) become the gate the moment someone sets them.
    environment: staging

    permissions:
      contents: read
      id-token: write # OIDC only. There are no static AWS keys in this repo.

    env:
      AWS_REGION: eu-west-2
      CLUSTER: nt-staging
      SERVICE: nt-staging-api
      TASK_FAMILY: nt-staging-api
      WORKERS_SERVICE: nt-staging-workers
      WORKERS_TASK_FAMILY: nt-staging-workers
      MIGRATE_TASK_FAMILY: nt-staging-migrate
      MIGRATE_LOG_GROUP: /nt/staging/migrate
      EDGE_HOST: api.neoting.neovogent.com

    steps:
      - uses: actions/checkout@v4

      # Trusted for exactly one subject — refs/heads/main — in the role's own
      # trust policy (infra/envs/staging/main.tf). The `if:` above is a
      # convenience; that condition is the security boundary.
      - name: Assume the staging deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::252959251643:role/nt-staging-ci-deploy
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The task definitions pin ARM64 (Graviton, ~20% cheaper — services.tf).
      # GitHub-hosted arm64 runners are not available on this org's plan, so
      # the build is emulated. Measured at ~6 minutes: sharp resolves a
      # PREBUILT @img/sharp-linux-arm64, so QEMU is paying for I/O, not for
      # compiling a native module. If that ever changes, the sanctioned
      # fallback is flipping cpu_architecture to X86_64 in services.tf — the
      # comment there costs it at a few dollars a month.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      # ONE build, pushed to TWO repositories. api and workers share an image
      # by design (apps/api/Dockerfile); services.tf points the workers task
      # definition at nt/workers, so the tag has to exist in both. Same
      # content, same digest, no second build.
      #
      # The tag is the commit SHA because ECR tags are IMMUTABLE (compute.tf) —
      # a tag can therefore never move under a running task, and "which commit
      # is in staging" is answerable from the task definition alone.
      - name: Build and push the api image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          provenance: false # keeps a single-arch manifest ECS can pull directly
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/nt/api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/nt/workers:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Read the live definition rather than rendering one from scratch: it is
      # the only source that already carries the secrets, roles, log config and
      # environment Terraform put there. Rendering here would mean maintaining
      # the same container definition in two places, and they would drift.
      - name: Register a task definition revision pinned to this commit
        id: taskdef
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > live.json

          # Strip the server-populated fields register-task-definition rejects.
          jq --arg image "${{ steps.ecr.outputs.registry }}/nt/api:${{ github.sha }}" '
            .containerDefinitions |= map(if .name == "api" then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' live.json > next.json

          arn=$(aws ecs register-task-definition --cli-input-json file://next.json \
                  --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "registered $arn"

      # Same read-the-live-definition trick as the api, for the same reason: the
      # migrate family carries DB_MIGRATOR_USER/PASSWORD and DB_APP_ROLE_PASSWORD
      # as Secrets Manager injections that only Terraform knows about.
      - name: Register a migrate task definition revision pinned to this commit
        id: migratedef
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$MIGRATE_TASK_FAMILY" \
            --query taskDefinition > live-migrate.json

          jq --arg image "${{ steps.ecr.outputs.registry }}/nt/api:${{ github.sha }}" '
            .containerDefinitions |= map(if .name == "migrate" then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' live-migrate.json > next-migrate.json

          arn=$(aws ecs register-task-definition --cli-input-json file://next-migrate.json \
                  --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "registered $arn"

      # ⚠ BEFORE the service update, deliberately. A failed migration must stop
      # the deploy with the OLD code still serving — which is only safe because
      # §5.3 requires migrations to be additive. A destructive migration would
      # break the running version in the window between this step and the next.
      #
      # The network configuration is READ FROM THE API SERVICE rather than
      # hardcoded. Subnet and security-group IDs are Terraform's to know, and a
      # second copy here would be wrong the first time the network changes — the
      # failure would be a task stuck in PROVISIONING with no route to RDS.
      - name: Run migrations (ecs run-task, inside the VPC)
        id: migrate
        run: |
          set -euo pipefail

          netcfg=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                     --query 'services[0].networkConfiguration' --output json)

          run=$(aws ecs run-task \
                  --cluster "$CLUSTER" \
                  --task-definition "${{ steps.migratedef.outputs.arn }}" \
                  --launch-type FARGATE \
                  --network-configuration "$netcfg" \
                  --started-by "gha-${{ github.run_id }}" \
                  --output json)

          # run-task returns HTTP 200 with an empty `tasks` array and a populated
          # `failures` array when placement fails. Trusting the exit code alone
          # would report a migration that never started as a success.
          failures=$(echo "$run" | jq -r '.failures | length')
          if [ "$failures" != "0" ]; then
            echo "::error title=Migration task could not start::$(echo "$run" | jq -c '.failures')"
            exit 1
          fi

          task_arn=$(echo "$run" | jq -r '.tasks[0].taskArn')
          task_id="${task_arn##*/}"
          echo "task=$task_id" >> "$GITHUB_OUTPUT"
          echo "running migration task $task_id"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
                        --query 'tasks[0].containers[0].exitCode' --output text)
          reason=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
                     --query 'tasks[0].stoppedReason' --output text)

          echo "--- migration log ---"
          # Best-effort: the stream only exists once the container actually
          # started, and a placement failure has no log at all. Never let a
          # missing log turn a real exit code into a green deploy.
          aws logs get-log-events \
            --log-group-name "$MIGRATE_LOG_GROUP" \
            --log-stream-name "migrate/migrate/$task_id" \
            --limit 200 --query 'events[].message' --output text 2>/dev/null || echo "(no log stream)"
          echo "--- end ---"

          # "None" is what --output text prints for a null exitCode, which is
          # what a task killed before the container ran reports.
          if [ "$exit_code" != "0" ]; then
            echo "::error title=Migration failed::exitCode=$exit_code stoppedReason=$reason. The deploy stopped here and the previously deployed code is still serving."
            exit 1
          fi
          echo "migration succeeded"

      # desired_count is in ignore_changes on the service (services.tf) because
      # CI owns it. It is 0 until the first image exists, so the first deploy
      # has to raise it — but every deploy after this must NOT, or this step
      # would stamp on autoscaling the day it lands.
      - name: Deploy
        run: |
          set -euo pipefail
          current=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                      --query 'services[0].desiredCount' --output text)
          echo "current desired count: $current"

          if [ "$current" = "0" ]; then
            echo "first deploy — raising desired count to 2 (services.tf sizes api at 2 tasks)"
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
              --task-definition "${{ steps.taskdef.outputs.arn }}" \
              --desired-count 2 --no-cli-pager > /dev/null
          else
            aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
              --task-definition "${{ steps.taskdef.outputs.arn }}" --no-cli-pager > /dev/null
          fi

      # The circuit breaker (services.tf) rolls back on its own if the tasks
      # cannot pass the target-group health check. This wait is what turns that
      # rollback into a RED pipeline instead of a green one in front of a
      # silently reverted service.
      - name: Wait for the service to reach steady state
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      # Through CloudFront, not the ALB: the HTTPS listener's default action is
      # a 403 and only the origin-verified rule passes traffic (alb.tf), so
      # hitting the ALB directly proves nothing. This asserts the whole edge
      # path — DNS, CloudFront, WAF, ALB, target group, container.
      - name: Post-deploy check — /healthz through the edge
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$EDGE_HOST/healthz" || true)
            echo "attempt $attempt: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error title=Deployed but not serving::https://$EDGE_HOST/healthz did not return 200 within 100s. ECS reported steady state, so look at CloudFront, WAF and the ALB origin-verify rule before the container."
          exit 1

      # Workers last: it consumes the queue the api fills, so a worker running
      # older code than the api is the ordering that matters least. The image is
      # the SAME digest as the api — one build, pushed to two repositories.
      - name: Register a workers task definition revision pinned to this commit
        id: workersdef
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$WORKERS_TASK_FAMILY" \
            --query taskDefinition > live-workers.json

          jq --arg image "${{ steps.ecr.outputs.registry }}/nt/workers:${{ github.sha }}" '
            .containerDefinitions |= map(if .name == "workers" then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' live-workers.json > next-workers.json

          arn=$(aws ecs register-task-definition --cli-input-json file://next-workers.json \
                  --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "registered $arn"

      - name: Deploy workers
        run: |
          set -euo pipefail
          current=$(aws ecs describe-services --cluster "$CLUSTER" --services "$WORKERS_SERVICE" \
                      --query 'services[0].desiredCount' --output text)
          echo "current desired count: $current"

          if [ "$current" = "0" ]; then
            echo "first workers deploy — raising desired count to 1 (services.tf sizes workers at 1 task)"
            aws ecs update-service --cluster "$CLUSTER" --service "$WORKERS_SERVICE" \
              --task-definition "${{ steps.workersdef.outputs.arn }}" \
              --desired-count 1 --no-cli-pager > /dev/null
          else
            aws ecs update-service --cluster "$CLUSTER" --service "$WORKERS_SERVICE" \
              --task-definition "${{ steps.workersdef.outputs.arn }}" --no-cli-pager > /dev/null
          fi

      # ⚠ WEAKER THAN THE API'S EQUIVALENT, AND WORTH KNOWING. workers has no
      # load balancer and no container healthCheck (services.tf carries the TODO),
      # so ECS calls a task healthy the moment it is RUNNING. This proves the
      # container started and stayed up; it does NOT prove it reached Redis. A
      # worker that connects and then silently stops consuming still looks
      # identical to an idle one until the queue-age alarm fires.
      - name: Wait for workers to reach steady state
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services "$WORKERS_SERVICE"

      - name: Say what was and was not deployed
        if: ${{ always() }}
        run: |
          {
            echo "### Stage 9 — deployed"
            echo
            echo "- **migrations** — \`prisma migrate deploy\` ran as ECS task \`${{ steps.migrate.outputs.task || 'not started' }}\`, before any service was updated."
            echo "- **api** → \`${{ github.sha }}\`, live at https://$EDGE_HOST"
            echo "- **workers** → \`${{ github.sha }}\`, consuming BullMQ over TLS."
            echo
            echo "#### Still fixture-mode, by design"
            echo
            echo "- **Email intake**: \`EMAIL_SOURCE\` stays \`fixture\` — the s3 poller"
            echo "  (\`worker/email-intake-main.js\`) has no ECS service yet, and env.ts refuses"
            echo "  \`EMAIL_SOURCE=s3\` against fixture stores anyway."
            echo "- **PDF hardening**: \`DOCUMENT_GUARD\` stays \`fixture\` — qpdf is not in the image."
            echo
            echo "Workers has no load balancer and no container health check, so steady state"
            echo "proves the task started, not that it reached Redis (the revision assertion"
            echo "above catches rollbacks, not silent idling)."
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # THE GATE. Branch protection requires the status check named `check` and
  # nothing else, so this job is the merge contract: it fails if any stage
  # failed or was cancelled, and it repeats the debt so that the last thing on
  # the run page is what did NOT run.
  #
  # `always()` is required — without it, a skipped dependency skips this job
  # too, and a required check that never reports blocks the PR forever.
  # =========================================================================
  check:
    needs: [readiness, verify, e2e, eval, eval-debt, security, deploy]
    if: ${{ always() && (github.event_name == 'push' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Aggregate the stage results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "stage results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*)
              echo "::error title=Pipeline failed::At least one stage failed or was cancelled. main must stay deployable — a broken main is a stop-the-line event (§14)."
              exit 1
              ;;
          esac
          echo "All stages that ran, passed. Stages that did not run are listed in the readiness summary above — they passed nothing."
